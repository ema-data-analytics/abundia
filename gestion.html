<script>
// ---- Promociones y banners (igual en la página de clientas y en la vista previa de gestión) ----
const ESTILOS_PROMO = [[1, 'Verde Abundia'], [2, 'Dorado'], [3, 'Crema'], [4, 'Blanco']];
function fechaCortaPromo(iso) { const x = String(iso || '').slice(0, 10).split('-'); return x.length === 3 ? x[2] + '/' + x[1] : ''; }
// conBoton: true muestra el botón "Reservar" (si la promo tiene un servicio que se puede reservar)
function promoHtml(pr, conBoton) {
  const escP = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const boton = conBoton && pr.servicio_id ? '<button type="button" class="reservar" data-promo-s="' + pr.servicio_id + '">Reservar</button>' : '';
  if (pr.tipo === 'banner') return '<figure class="banner">' + (pr.imagen ? '<img src="' + pr.imagen + '" alt="' + escP(pr.titulo) + '">' : '') + boton + '</figure>';
  return '<article class="promo e' + (pr.estilo || 1) + '">' + (pr.imagen ? '<img src="' + pr.imagen + '" alt="">' : '') + '<div class="cuerpo">' +
    (pr.etiqueta ? '<span class="etq">' + escP(pr.etiqueta) + '</span>' : '') + '<h3>' + escP(pr.titulo) + '</h3>' +
    (pr.texto ? '<p>' + escP(pr.texto) + '</p>' : '') + (pr.hasta ? '<span class="hasta">Hasta el ' + fechaCortaPromo(pr.hasta) + '</span>' : '') + boton + '</div></article>';
}
function promosHtml(lista, conBoton) {
  if (!lista || !lista.length) return '';
  const bs = lista.filter((p) => p.tipo === 'banner'), ps = lista.filter((p) => p.tipo !== 'banner');
  return '<section class="promos" aria-label="Promociones">' + (bs.length ? '<div class="banners' + (bs.length > 1 ? ' varios' : '') + '">' + bs.map((p) => promoHtml(p, conBoton)).join('') + '</div>' : '') +
    ps.map((p) => promoHtml(p, conBoton)).join('') + '</section>';
}
// Achica una foto en el navegador antes de guardarla (máx. 1080 px de ancho, webp o jpg, menos de ~600 KB)
function achicarFoto(archivo) {
  return new Promise((ok, mal) => {
    if (!archivo || !/^image\//.test(archivo.type)) return mal(new Error('Elegí una foto o imagen.'));
    const lector = new FileReader();
    lector.onerror = () => mal(new Error('No se pudo leer la foto.'));
    lector.onload = () => {
      const im = new Image();
      im.onerror = () => mal(new Error('No se pudo abrir la foto. Probá con otra.'));
      im.onload = () => {
        let ancho = Math.min(1080, im.naturalWidth), cal = 0.82, url = '';
        for (let intento = 0; intento < 8; intento++) {
          const alto = Math.round(im.naturalHeight * ancho / im.naturalWidth);
          const cv = document.createElement('canvas'); cv.width = ancho; cv.height = alto;
          cv.getContext('2d').drawImage(im, 0, 0, ancho, alto);
          url = cv.toDataURL('image/webp', cal);
          if (!url.startsWith('data:image/webp')) url = cv.toDataURL('image/jpeg', cal);
          if (url.length <= 600000) return ok(url);
          if (cal > 0.55) cal -= 0.1; else ancho = Math.round(ancho * 0.8);
        }
        mal(new Error('La foto es muy pesada. Probá con otra.'));
      };
      im.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const raiz = $('#raiz');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plata = (n) => '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 2 });
const fF = (d, o) => new Intl.DateTimeFormat('es-AR', Object.assign({ timeZone: TZ }, o)).format(new Date(d));
const fHora = (d) => fF(d, { hour: '2-digit', minute: '2-digit', hour12: false });
const fDia = (d) => fF(d, { weekday: 'long', day: 'numeric', month: 'long' });
const fCorta = (d) => fF(d, { day: '2-digit', month: '2-digit' }) + ' ' + fHora(d);
const fFecha = (iso) => { const x = String(iso || '').slice(0, 10).split('-'); return x.length === 3 ? x[2] + '/' + x[1] + '/' + x[0] : esc(iso); };
const diaISO = (d) => fF(d, { year: 'numeric', month: '2-digit', day: '2-digit' }).split('/').reverse().join('-');
const hoyISO = () => diaISO(new Date());
const sumar = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const EST = { pendiente_sena: ['Esperando seña', ''], sena_a_verificar: ['Seña a verificar', ''], confirmado: ['Confirmado', 'info'], en_curso: ['Llegó', 'ok'],
  terminado: ['Cobrado', 'ok'], vencido: ['Vencido', 'mal'], rechazado: ['Seña rechazada', 'mal'], cancelado_a_tiempo: ['Anulado a tiempo', 'mal'],
  cancelado_fuera_termino: ['Anulado fuera de término', 'mal'], cancelado_por_centro: ['Cancelado por el centro', 'mal'], ausente: ['Ausente', 'mal'], reprogramado: ['Reprogramado', ''] };
const MEDIOS = [{ id: 1, n: 'Efectivo' }, { id: 2, n: 'Transferencia' }];

let YO = null, CENTRO = null, VISTA = 'agenda', FECHA = hoyISO();

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) {
    if (/JWT|session|token/i.test(error.message || '')) { await sb.auth.signOut(); return pantallaLogin('Tu sesión venció. Entrá de nuevo.'); }
    throw new Error(error.message || 'No se pudo completar.');
  }
  return data;
}
function modal(html) { $('#modalCaja').innerHTML = html; $('#modal').hidden = false; return $('#modalCaja'); }
function cerrarModal() { $('#modal').hidden = true; $('#modalCaja').innerHTML = ''; }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') cerrarModal(); });
function errorEn(el, e) { el.innerHTML = '<p class="aviso error" role="alert">' + esc(e.message || e) + '</p>'; }
function wa(cel, texto) { const n = String(cel || '').replace(/\D/g, ''); return n ? 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto) : null; }
async function conBoton(btn, fn) { const t = btn.textContent; btn.disabled = true; btn.textContent = 'Un momento…'; try { await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = t; } } }

// =============================================================== Ingreso
function pantallaLogin(msg) {
  raiz.innerHTML = '<div class="gut"><form class="card login" id="flogin"><img src="' + LOGO + '" alt="Abundia"><h2 style="text-align:center">Gestión</h2>' +
    (msg ? '<p class="aviso">' + esc(msg) + '</p>' : '') +
    '<div class="campo"><label for="usuario">Usuario</label><input id="usuario" autocomplete="username" autocapitalize="none" required></div>' +
    '<div class="campo"><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" required></div>' +
    '<button class="btn" type="submit">Entrar</button><div id="lerr"></div><p style="text-align:center;margin-top:14px"><a href="manual.html" target="_blank" rel="noopener" id="ayudaLogin">¿Primera vez? Abrí el manual</a></p></form></div>';
  $('#flogin').onsubmit = async (e) => {
    e.preventDefault();
    const u = $('#usuario').value.trim().toLowerCase(), c = $('#clave').value;
    await conBoton($('#flogin button'), async () => {
      const { error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + '@abundia.local', password: c });
      if (error) return errorEn($('#lerr'), /invalid|credentials/i.test(error.message) ? 'Usuario o contraseña incorrectos.' : error.message);
      await arrancar();
    });
  };
}
function pantallaClave(obligatoria) {
  const caja = modal('<h3>' + (obligatoria ? 'Elegí tu contraseña' : 'Cambiar contraseña') + '</h3>' + (obligatoria ? '<p class="muted">Es la primera vez que entrás: cambiá la contraseña provisoria por una tuya.</p>' : '') +
    '<div class="campo"><label for="c1">Contraseña actual</label><input id="c1" type="password" autocomplete="current-password"></div>' +
    '<div class="campo"><label for="c2">Contraseña nueva <span>(mínimo 8)</span></label><input id="c2" type="password" autocomplete="new-password"></div>' +
    '<div class="campo"><label for="c3">Repetila</label><input id="c3" type="password" autocomplete="new-password"></div>' +
    '<div class="fila"><button class="btn" id="cok">Guardar</button>' + (obligatoria ? '' : '<button class="btn sec" id="cno">Cancelar</button>') + '</div><div id="cerr"></div>');
  if (!obligatoria) $('#cno').onclick = cerrarModal;
  $('#cok').onclick = () => conBoton($('#cok'), async () => {
    if ($('#c2').value !== $('#c3').value) return errorEn($('#cerr'), 'Las dos contraseñas nuevas no coinciden.');
    try { await rpc('cambiar_mi_clave', { p_actual: $('#c1').value, p_nueva: $('#c2').value }); cerrarModal(); YO.debe_cambiar_clave = false; mostrar(VISTA); }
    catch (e) { errorEn($('#cerr'), e); }
  });
  if (obligatoria) $('#modal').onclick = null;
  return caja;
}

// =============================================================== Marco
async function arrancar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return pantallaLogin();
  try { YO = await rpc('mi_usuario'); } catch (e) { return pantallaLogin(e.message); }
  if (!YO || !YO.es_admin) { await sb.auth.signOut(); return pantallaLogin('Ese usuario no tiene acceso a la gestión.'); }
  const vistas = [['agenda', 'Agenda'], ['nuevo', 'Nuevo turno'], ['caja', 'Caja'], ['clientas', 'Clientas'], ['ajustes', 'Ajustes']];
  raiz.innerHTML = '<header class="top gut"><div class="col"><img src="' + LOGO + '" alt=""><span class="quien">' + esc(YO.nombre) + (YO.es_super ? ' · superusuario' : ' · administradora') + '</span>' +
    '<a href="' + PUBLICA + '" target="_blank" rel="noopener"><span class="largo">Ver página pública</span><span class="corto">Página</span></a><a href="manual.html" target="_blank" rel="noopener" id="ayuda">Ayuda</a><button type="button" id="mclave">Contraseña</button><button type="button" id="salir">Salir</button></div></header>' +
    '<nav class="tabs gut"><div class="col">' + vistas.map(([k, n]) => '<button type="button" data-v="' + k + '">' + n + '</button>').join('') + '</div></nav>' +
    '<main class="gut"><div class="col" id="vista"></div></main>';
  $$('nav.tabs button').forEach((b) => b.onclick = () => mostrar(b.dataset.v));
  $('#salir').onclick = async () => { await sb.auth.signOut(); pantallaLogin(); };
  $('#mclave').onclick = () => pantallaClave(false);
  mostrar('agenda');
  if (YO.debe_cambiar_clave) pantallaClave(true);
}
async function mostrar(v) {
  VISTA = v;
  $$('nav.tabs button').forEach((b) => b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'));
  const el = $('#vista'); el.innerHTML = '<p class="cargando">Cargando…</p>';
  try { await ({ agenda: vAgenda, nuevo: vNuevo, caja: vCaja, clientas: vClientas, ajustes: vAjustes })[v](el); }
  catch (e) { errorEn(el, e); }
}

// =============================================================== Agenda
function itemsHtml(t) {
  return t.items.map((i) => '<div class="serv"><i style="background:' + esc(i.color) + '"></i><b>' + fHora(i.inicio) + '–' + fHora(i.fin_atencion) + '</b> ' + esc(i.servicio) +
    (i.cantidad > 1 ? ' · ' + i.cantidad + ' zonas' : '') + ' · ' + esc(i.profesional) + (i.cabina ? ' · ' + esc(i.cabina) : '') + '</div>').join('');
}
function msgWA(t, tipo) {
  const c = CENTRO || {}, cuando = fDia(t.inicio) + ' a las ' + fHora(t.inicio) + ' h', nom = t.cliente.nombre.split(' ')[0];
  const link = new URL(PUBLICA, location.href).href + '?t=' + t.token;
  if (tipo === 'sena') return 'Hola ' + nom + '! Para confirmar tu turno del ' + cuando + ' transferí la seña de ' + plata(t.sena_importe) + (c.alias ? ' al alias ' + c.alias + (c.titular ? ' (' + c.titular + ')' : '') : '') + ' y mandame el comprobante por acá. Tu turno: ' + link;
  if (tipo === 'recordatorio') return 'Hola ' + nom + '! Te recordamos tu turno en ' + (c.nombre || 'Abundia') + ' el ' + cuando + '. Tolerancia de llegada: ' + (c.tolerancia_min || 10) + ' minutos. Si no podés venir avisanos con tiempo. ' + link;
  return 'Hola ' + nom + '! Tu turno del ' + cuando + ' está confirmado. Te esperamos. ' + link;
}
const puedeDiaNuevo = (t) => (t.estado === 'cancelado_por_centro' || (t.estado === 'cancelado_a_tiempo' && (!t.sena_favor_vence_at || new Date(t.sena_favor_vence_at) > new Date())))
  && t.sena_pagada && !t.sena_perdida;
const vezVeces = (n) => n + (n === 1 ? ' vez' : ' veces');
function accionesTurno(t) {
  const b = [], cel = t.cliente.celular;
  const W = (tipo, txt) => cel ? '<a class="btn wa chico" target="_blank" rel="noopener" href="' + wa(cel, msgWA(t, tipo)) + '">' + txt + '</a>' : '';
  if (['pendiente_sena', 'sena_a_verificar', 'vencido'].includes(t.estado)) b.push('<button class="btn ok chico" data-a="sena">Seña recibida</button>');
  if (['pendiente_sena', 'sena_a_verificar'].includes(t.estado)) b.push('<button class="btn sec chico" data-a="rechazar">Rechazar seña</button>', W('sena', 'Pedir seña'));
  if (t.estado === 'confirmado') b.push('<button class="btn ok chico" data-a="llego">Llegó</button>');
  if (['confirmado', 'en_curso'].includes(t.estado)) b.push('<button class="btn chico" data-a="cobrar">Cobrar</button>');
  if (t.estado === 'confirmado') b.push(W('recordatorio', 'Recordar'), W('confirmado', 'Avisar confirmado'));
  if (['pendiente_sena', 'sena_a_verificar', 'confirmado'].includes(t.estado)) b.push('<button class="btn sec chico" data-a="reprogramar">Reprogramar</button>', '<button class="btn sec chico" data-a="cancelar">Cancelar</button>');
  if (puedeDiaNuevo(t)) b.push('<button class="btn chico" data-a="reprogramar">Elegir día nuevo</button>');
  if (t.estado === 'confirmado') b.push('<button class="btn sec chico" data-a="ausente">No vino</button>');
  if (t.estado === 'ausente' && YO.es_admin) b.push('<button class="btn sec chico" data-a="deshacer">Deshacer ausente</button>');
  b.push('<button class="btn sec chico" data-a="nota">Nota</button>');
  return '<div class="acciones">' + b.join('') + '</div>';
}
// saldo a favor de la clienta sin contar la seña ya pagada de este mismo turno
function aFavorExtra(t) {
  if (['terminado'].includes(t.estado)) return 0;
  const propia = t.sena_pagada && !t.sena_perdida ? (t.sena_importe || 0) : 0;
  return Math.max(0, Math.round(((t.a_favor_clienta || 0) - propia) * 100) / 100);
}
function turnoHtml(t, conFecha) {
  const e = EST[t.estado] || [t.estado, ''];
  let sena = '';
  if (t.sena_exenta) sena = 'Sin seña (' + esc(t.sena_exenta_motivo) + ')';
  else if (t.sena_importe > 0) sena = 'Seña ' + plata(t.sena_importe) + (t.sena_pagada ? ' ✓ pagada' : t.estado === 'pendiente_sena' ? ' · vence ' + fHora(t.sena_vence_at) : '') + (t.sena_perdida ? ' · perdida' : '');
  return '<article class="card turno ' + t.estado + '" data-t="' + t.id + '"><div class="fila entre"><span class="hora">' + (conFecha ? fCorta(t.inicio) : fHora(t.inicio)) + '</span><span class="chip ' + e[1] + '">' + e[0] + '</span></div>' +
    '<div><b>' + esc(t.cliente.nombre) + '</b> ' + (t.cliente.celular ? '<a href="' + wa(t.cliente.celular, 'Hola ' + t.cliente.nombre.split(' ')[0] + '!') + '" target="_blank" rel="noopener">' + esc(t.cliente.celular.replace('+549', '')) + '</a>' : '') +
    ' <span class="muted">· ' + esc(t.numero) + (t.origen === 'web' ? ' · web' : '') + '</span></div>' + itemsHtml(t) +
    '<div class="fila entre"><span>Total <b>' + plata(t.total) + '</b>' + (sena ? ' · <span class="muted">' + sena + '</span>' : '') + (aFavorExtra(t) > 0 ? ' · <span class="chip ok">a favor ' + plata(aFavorExtra(t)) + '</span>' : '') + '</span>' +
    (t.venta ? '<span class="muted">Venta ' + esc(t.venta) + '</span>' : '') + '</div>' +
    (t.nota_clienta ? '<p class="muted">Nota de la clienta: ' + esc(t.nota_clienta) + '</p>' : '') + (t.nota_interna ? '<p class="aviso">' + esc(t.nota_interna) + '</p>' : '') +
    (t.motivo_cancelacion ? '<p class="muted">' + esc(t.motivo_cancelacion) + '</p>' : '') +
    (t.reprogramaciones > 0 && !/cancelado|vencido|rechazado|reprogramado/.test(t.estado) ? '<p class="muted">La clienta ya lo cambió ' + vezVeces(t.reprogramaciones) + '.</p>' : '') +
    (puedeDiaNuevo(t) ? '<p class="aviso">Seña a favor' + (t.estado === 'cancelado_a_tiempo' && t.sena_favor_vence_at ? ' hasta el ' + fCorta(t.sena_favor_vence_at) + ' h' : '') + ': tocá "Elegir día nuevo" cuando la clienta lo elija.</p>' : '') +
    accionesTurno(t) + '</article>';
}
let AG = null, MODO_AG = 'dia';
// Botones "Día" / "Semana" arriba de la agenda
const modoAgHtml = () => '<div class="sub" id="modoAg" role="group" aria-label="Ver la agenda por"><button type="button" data-m="dia" aria-pressed="' + (MODO_AG === 'dia') + '">Día</button>' +
  '<button type="button" data-m="semana" aria-pressed="' + (MODO_AG === 'semana') + '">Semana</button></div>';
function engancharModoAg(el) { $$('#modoAg button', el).forEach((b) => b.onclick = () => { MODO_AG = b.dataset.m; mostrar('agenda'); }); }
const diaMes = (iso) => +iso.slice(8, 10) + '/' + +iso.slice(5, 7);
const nombreDia = (iso) => DIAS[new Date(iso + 'T12:00:00Z').getUTCDay() || 7];
async function vSemana(el) {
  const S = await rpc('agenda_semana', { p_fecha: FECHA }), hoy = hoyISO();
  const n = S.dias.reduce((a, d) => a + d.turnos.length, 0);
  let h = '<div class="vista">' + modoAgHtml();
  h += '<div class="dianav"><button class="btn sec chico" id="antS" aria-label="Semana anterior">‹</button><span class="hoy">Semana del ' + diaMes(S.desde) + ' al ' + diaMes(S.hasta) + '</span>' +
    '<button class="btn sec chico" id="hoyS">Esta semana</button><button class="btn sec chico" id="sigS" aria-label="Semana siguiente">›</button></div>';
  h += '<p class="muted">' + (n === 1 ? '1 turno' : n + ' turnos') + ' en la semana. Tocá un turno o "Ver día" para cobrar, confirmar o cambiarlo.</p>';
  if (S.profesionales.length) h += '<div class="leyenda">' + S.profesionales.map((p) => '<span><i style="background:' + esc(p.color) + '"></i>' + esc(p.nombre) + '</span>').join('') + '</div>';
  h += S.dias.map((d) => {
    const titulo = nombreDia(d.fecha) + ' ' + diaMes(d.fecha);
    if (!d.abierto && !d.turnos.length && !d.bloqueos.length) return '<div class="sem-cerrado"><b>' + titulo + '</b><span>Cerrado</span></div>';
    return '<section class="card sem-dia' + (d.fecha === hoy ? ' es-hoy' : '') + '" data-fecha="' + d.fecha + '"><div class="fila entre"><h3>' + titulo + (d.fecha === hoy ? ' <span class="chip info">Hoy</span>' : '') + '</h3>' +
      '<button class="btn sec chico" data-dia="' + d.fecha + '">Ver día</button></div>' +
      d.bloqueos.map((b) => '<p class="aviso">Bloqueado ' + fHora(b.desde) + '–' + fHora(b.hasta) + ' · ' + esc(b.motivo) + (b.profesional ? ' · ' + esc(b.profesional) : b.cabina ? ' · ' + esc(b.cabina) : ' · todo el centro') + '</p>').join('') +
      (d.turnos.length ? '<div class="sem-lista">' + d.turnos.map((t) => '<button type="button" class="sem-t ' + t.estado + '" data-dia="' + d.fecha + '"><span class="hora">' + fHora(t.inicio) + '</span>' +
        '<span class="quien"><b>' + esc(t.cliente) + '</b>' + t.items.map((i) => '<span class="serv"><i style="background:' + esc(i.color) + '"></i>' + esc(i.servicio) + (i.cantidad > 1 ? ' · ' + i.cantidad + ' zonas' : '') + ' · ' + esc(i.profesional) + '</span>').join('') + '</span>' +
        '<span class="chip ' + EST[t.estado][1] + '">' + EST[t.estado][0] + '</span></button>').join('') + '</div>' : '<p class="muted">Sin turnos.</p>') + '</section>';
  }).join('');
  h += '<button class="btn" id="nuevoT">+ Turno nuevo</button></div>';
  el.innerHTML = h;
  engancharModoAg(el);
  $('#antS').onclick = () => { FECHA = sumar(FECHA, -7); mostrar('agenda'); };
  $('#sigS').onclick = () => { FECHA = sumar(FECHA, 7); mostrar('agenda'); };
  $('#hoyS').onclick = () => { FECHA = hoyISO(); mostrar('agenda'); };
  $('#nuevoT').onclick = () => mostrar('nuevo');
  $$('[data-dia]', el).forEach((b) => b.onclick = () => { FECHA = b.dataset.dia; MODO_AG = 'dia'; mostrar('agenda'); });
}
async function vAgenda(el) {
  if (MODO_AG === 'semana') return vSemana(el);
  AG = await rpc('agenda_dia', { p_fecha: FECHA });
  CENTRO = AG.centro;
  const activos = AG.turnos.filter((t) => !/cancelado|vencido|rechazado/.test(t.estado));
  const bajas = AG.turnos.filter((t) => /cancelado|vencido|rechazado/.test(t.estado));
  let h = '<div class="vista">' + modoAgHtml();
  if (!AG.caja_abierta) h += '<div class="aviso fila entre"><span>La caja está <b>cerrada</b>. Abrila para cobrar.</span><button class="btn chico" id="irCaja">Abrir caja</button></div>';
  if (!CENTRO.whatsapp || !CENTRO.alias) h += '<p class="aviso">Falta cargar ' + [!CENTRO.whatsapp && 'el WhatsApp del centro', !CENTRO.alias && 'el alias para las señas'].filter(Boolean).join(' y ') + ' (Ajustes → Configuración, lo carga el superusuario).</p>';
  if (AG.senas_pendientes.length) h += '<section class="card" style="border-color:#c9a227"><h3>Señas para controlar (' + AG.senas_pendientes.length + ')</h3><div class="lista">' + AG.senas_pendientes.map((t) => turnoHtml(t, true)).join('') + '</div></section>';
  h += '<div class="dianav"><button class="btn sec chico" id="ant" aria-label="Día anterior">‹</button><span class="hoy">' + fDia(FECHA + 'T15:00:00Z') + '</span>' +
    '<button class="btn sec chico" id="hoy">Hoy</button><input type="date" id="fecha" value="' + FECHA + '" class="btn sec chico" aria-label="Elegir día"><button class="btn sec chico" id="sig" aria-label="Día siguiente">›</button></div>';
  h += AG.bloqueos.map((b) => '<p class="aviso">Bloqueado ' + fHora(b.desde) + '–' + fHora(b.hasta) + ' · ' + esc(b.motivo) + (b.profesional ? ' · ' + esc(b.profesional) : b.cabina ? ' · ' + esc(b.cabina) : ' · todo el centro') + '</p>').join('');
  h += activos.length ? activos.map((t) => turnoHtml(t)).join('') : '<p class="card muted">No hay turnos este día.</p>';
  if (bajas.length) h += '<details class="card"><summary>Anulados y vencidos (' + bajas.length + ')</summary><div class="lista" style="margin-top:10px">' + bajas.map((t) => turnoHtml(t)).join('') + '</div></details>';
  h += '<button class="btn" id="nuevoT">+ Turno nuevo</button></div>';
  el.innerHTML = h;
  engancharModoAg(el);
  $('#ant').onclick = () => { FECHA = sumar(FECHA, -1); mostrar('agenda'); };
  $('#sig').onclick = () => { FECHA = sumar(FECHA, 1); mostrar('agenda'); };
  $('#hoy').onclick = () => { FECHA = hoyISO(); mostrar('agenda'); };
  $('#fecha').onchange = (e) => { if (e.target.value) { FECHA = e.target.value; mostrar('agenda'); } };
  $('#nuevoT').onclick = () => mostrar('nuevo');
  if ($('#irCaja')) $('#irCaja').onclick = () => mostrar('caja');
  const todos = [...AG.turnos, ...AG.senas_pendientes];
  $$('[data-a]', el).forEach((b) => b.onclick = () => accion(b.dataset.a, todos.find((t) => t.id === +b.closest('[data-t]').dataset.t), b));
}
async function accion(a, t, btn) {
  const recargar = () => { cerrarModal(); mostrar(VISTA === 'clientas' ? 'clientas' : 'agenda'); };
  const simple = async (fn, args) => conBoton(btn, async () => { try { await rpc(fn, args); recargar(); } catch (e) { modal('<p class="aviso error">' + esc(e.message) + '</p><button class="btn sec" onclick="cerrarModal()">Cerrar</button>'); } });
  if (a === 'llego') return simple('turno_llego', { p_turno: t.id });
  if (a === 'sena') {
    const c = modal('<h3>Seña recibida</h3><p>' + esc(t.cliente.nombre) + ' · ' + plata(t.sena_importe) + '</p><div class="campo"><label for="ref">Referencia <span>(opcional: n° de operación)</span></label><input id="ref"></div>' +

async function cobrar(t) {

    (resto > 0 ? MEDIOS.map((m) => '<div class="campo"><label for="m' + m.id + '">' + m.n + '</label><input id="m' + m.id + '" type="number" min="0" step="0.01" inputmode="decimal" value="' + (m.id === 1 ? resto : 0) + '"></div>').join('') +

  $$('input', c).forEach((i) => i.oninput = act); act();

    try {

// Elegir horarios para una lista de renglones [{servicio_id, profesional_id, cantidad, nombre}]

      const arg = { p_servicio: l.servicio_id, p_fecha: fecha, p_profesional: l.profesional_id, p_cantidad: l.cantidad, p_desde: desde };

        '<button type="button" data-k="' + k + '" data-i="' + s.inicio + '" data-p="' + (l.profesional_id || s.profesionales[0].id) + '" title="' + esc(s.profesionales.map((p) => p.nombre).join(', ')) + '" aria-pressed="' + (l.inicio && +new Date(l.inicio) === +new Date(s.inicio)) + '">' + s.hora + '</button>').join('') + '</div>' : '<p class="muted">Sin horarios libres ese día.</p>') + '</div>';
    }

function franjasHtml(lista) {
  return '<div class="franjas">' + [1, 2, 3, 4, 5, 6, 7].map((d) => { const f = lista.filter((x) => x.dia === d);
    return '<div class="franja" data-dia="' + d + '"><b>' + DIAS[d] + '</b><input type="time" value="' + (f[0] ? f[0].desde : '') + '" aria-label="' + DIAS[d] + ' desde"><input type="time" value="' + (f[0] ? f[0].hasta : '') + '" aria-label="' + DIAS[d] + ' hasta">' +
      '<input type="time" value="' + (f[1] ? f[1].desde : '') + '" aria-label="' + DIAS[d] + ' desde (tarde)"><input type="time" value="' + (f[1] ? f[1].hasta : '') + '" aria-label="' + DIAS[d] + ' hasta (tarde)"></div>'; }).join('') +
    '<p class="muted">Dos franjas por día (mañana y tarde). Vacío = no atiende.</p></div>';
}
function leerFranjas(cont) {
  const out = [];
  $$('.franja', cont).forEach((f) => { const i = $$('input', f).map((x) => x.value);
    if (i[0] && i[1]) out.push({ dia: +f.dataset.dia, desde: i[0], hasta: i[1] });
    if (i[2] && i[3]) out.push({ dia: +f.dataset.dia, desde: i[2], hasta: i[3] }); });
  return out;
}

  let cambioImagen = false;
  const c = modal('<h3>' + (x ? 'Editar promoción' : 'Promoción nueva') + '</h3>' +
    '<div class="campo"><label>¿Qué querés armar?</label><label class="check"><input type="radio" name="ptipo" value="promo"' + (P.tipo !== 'banner' ? ' checked' : '') + '> <span><b>Promo</b>: tarjeta con título, texto y precio. La foto es opcional.</span></label>' +
    '<label class="check"><input type="radio" name="ptipo" value="banner"' + (P.tipo === 'banner' ? ' checked' : '') + '> <span><b>Banner o flyer</b>: una imagen ya diseñada (por ejemplo, de Canva).</span></label></div>' +
    '<div class="campo"><label for="pt">Título <span>(se lee grande)</span></label><input id="pt" maxlength="60" placeholder="Ej.: Mío Up 2x1" value="' + esc(P.titulo) + '"></div>' +
    '<div class="campo solo-promo"><label for="px">Texto <span>(opcional)</span></label><textarea id="px" rows="2" maxlength="220" placeholder="Ej.: Toda la semana, la segunda zona de regalo.">' + esc(P.texto || '') + '</textarea></div>' +
    '<div class="campo solo-promo"><label for="pe">Etiqueta <span>(opcional, ej.: 20% OFF o $4.000)</span></label><input id="pe" maxlength="24" value="' + esc(P.etiqueta || '') + '"></div>' +
    '<div class="campo solo-promo"><label>Color</label><div class="colores">' + ESTILOS_PROMO.map(([k, n]) => '<label class="color"><input type="radio" name="pcol" value="' + k + '"' + (+P.estilo === k ? ' checked' : '') + '><i class="e' + k + '"></i>' + n + '</label>').join('') + '</div></div>' +
    '<div class="campo"><span class="lbl">Foto o flyer <span class="txtfoto">(opcional)</span></span><div class="fila"><label class="btn sec foto-btn">📷 Elegir foto o flyer<input id="pf" type="file" accept="image/*"></label><button type="button" class="btn sec chico" id="psin">Sacar la foto</button></div><span class="muted" id="pfm"></span></div>' +
    '<div class="campo"><label for="ps">Botón "Reservar" <span>(opcional)</span></label><select id="ps"><option value="">Sin botón</option>' + servs.filter((s) => s.estado === 'activo').map((s) => '<option value="' + s.id + '"' + (s.id === P.servicio_id ? ' selected' : '') + '>' + esc(s.nombre) + (s.precio == null ? ' (sin precio: no se ve el botón)' : '') + '</option>').join('') + '</select></div>' +
    '<div class="grilla"><div class="campo"><label for="pd">Se ve desde</label><input id="pd" type="date" value="' + esc(String(P.desde || '').slice(0, 10)) + '"></div>' +
    '<div class="campo"><label for="ph">Hasta <span>(vacío = sin fin)</span></label><input id="ph" type="date" value="' + esc(String(P.hasta || '').slice(0, 10)) + '"></div></div>' +
    '<div class="campo"><label>Así se ve en la página</label><div id="pv" class="vprev"></div></div>' +
    '<div class="fila"><button class="btn" id="ok">Guardar</button><button class="btn sec" onclick="cerrarModal()">Volver</button></div><div id="err2"></div>');
  const leer = () => { P.tipo = $('input[name=ptipo]:checked', c).value; P.titulo = $('#pt', c).value; P.texto = $('#px', c).value; P.etiqueta = $('#pe', c).value;
    P.estilo = +$('input[name=pcol]:checked', c).value; P.servicio_id = $('#ps', c).value ? +$('#ps', c).value : null; P.desde = $('#pd', c).value; P.hasta = $('#ph', c).value; };
  const ver = () => { leer();
    $$('.solo-promo', c).forEach((e) => e.hidden = P.tipo === 'banner');
    $('.txtfoto', c).textContent = P.tipo === 'banner' ? '(obligatoria)' : '(opcional)';
    $('#psin', c).hidden = !P.imagen;
    $('#pv', c).innerHTML = P.tipo === 'banner' && !P.imagen ? '<p class="muted">Elegí la imagen del banner para verlo.</p>' : promosHtml([Object.assign({}, P, { titulo: P.titulo || 'Título de la promo' })], true);
    $$('#pv .reservar', c).forEach((b) => b.disabled = true); };
  $$('input, textarea, select', c).forEach((e) => { if (e.id !== 'pf') { e.oninput = ver; e.onchange = ver; } });
  $('#pf', c).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; $('#pfm', c).textContent = 'Preparando la foto…';
    try { P.imagen = await achicarFoto(f); cambioImagen = true; $('#pfm', c).textContent = 'Foto lista.'; } catch (er) { $('#pfm', c).textContent = er.message; } ver(); };
  $('#psin', c).onclick = () => { P.imagen = null; cambioImagen = true; $('#pf', c).value = ''; $('#pfm', c).textContent = 'Sin foto.'; ver(); };
  ver();
  $('#ok', c).onclick = () => conBoton($('#ok', c), async () => { leer();
    const p = { id: x ? x.id : null, tipo: P.tipo, titulo: P.titulo, texto: P.tipo === 'banner' ? '' : P.texto, etiqueta: P.tipo === 'banner' ? '' : P.etiqueta, estilo: P.estilo,
      servicio_id: P.servicio_id, desde: P.desde, hasta: P.hasta || null, estado: x ? x.estado : 'activa' };
    if (!x || cambioImagen) p.imagen = P.imagen || '';
    try { await rpc('promocion_guardar', { p }); cerrarModal(); vAjustes($('#vista')); } catch (er) { errorEn($('#err2', c), er); } });
}
async function aCabinas(sv) {
  const cabs = await rpc('cabinas_listar');
  sv.innerHTML = '<h2>Cabinas</h2><div class="lista">' + cabs.map((x) => '<div class="item"><span><b>' + esc(x.nombre) + '</b>' + (x.estado !== 'activa' ? ' <span class="chip mal">inactiva</span>' : '') + '<br><span class="muted">' + (x.servicios.map(esc).join(', ') || 'Ningún servicio la usa todavía') + '</span></span>' +
    '<button class="btn sec chico" data-id="' + x.id + '">' + (x.estado === 'activa' ? 'Desactivar' : 'Activar') + '</button></div>').join('') + '</div>' +
    '<div class="card"><div class="campo"><label for="cn">Cabina nueva</label><input id="cn" placeholder="Ej.: Cabina 2"></div><button class="btn" id="ok">Agregar</button><div id="err"></div></div>';
  $('#ok').onclick = () => conBoton($('#ok'), async () => { try { await rpc('cabina_guardar', { p: { nombre: $('#cn').value } }); vAjustes($('#vista')); } catch (e) { errorEn($('#err'), e); } });
  $$('[data-id]', sv).forEach((b) => b.onclick = () => conBoton(b, async () => { const x = cabs.find((y) => y.id === +b.dataset.id);
    try { await rpc('cabina_guardar', { p: { id: x.id, nombre: x.nombre, estado: x.estado === 'activa' ? 'inactiva' : 'activa' } }); vAjustes($('#vista')); } catch (e) { errorEn($('#err'), e); } }));
}
async function aHorario(sv) {
  const cfg = await rpc('config_ver');
  sv.innerHTML = '<h2>Horario del centro</h2><div class="card">' + franjasHtml(cfg.centro_horarios) + '<button class="btn" id="ok">Guardar horario</button><div id="err"></div></div><p class="muted">Para feriados o cierres puntuales usá "Bloqueos y feriados".</p>';
  $('#ok').onclick = () => conBoton($('#ok'), async () => { try { await rpc('centro_horarios_guardar', { p: leerFranjas(sv) }); $('#err').innerHTML = '<p class="aviso ok">Guardado.</p>'; } catch (e) { errorEn($('#err'), e); } });
}
async function aBloqueos(sv) {
  const [bl, profs, cabs] = await Promise.all([rpc('bloqueos_listar'), rpc('profesionales_listar'), rpc('cabinas_listar')]);
  const hoy = hoyISO();
  sv.innerHTML = '<h2>Bloqueos y feriados</h2><div class="card"><div class="grilla"><div class="campo"><label for="bd">Desde</label><input id="bd" type="datetime-local" value="' + hoy + 'T08:00"></div>' +
    '<div class="campo"><label for="bh">Hasta</label><input id="bh" type="datetime-local" value="' + hoy + 'T21:00"></div><div class="campo"><label for="bq">Para</label><select id="bq"><option value="">Todo el centro</option>' +
    profs.filter((p) => p.estado === 'activa').map((p) => '<option value="p' + p.id + '">' + esc(p.nombre) + '</option>').join('') + cabs.map((x) => '<option value="c' + x.id + '">' + esc(x.nombre) + '</option>').join('') + '</select></div>' +
    '<div class="campo"><label for="bm">Motivo</label><input id="bm" placeholder="Ej.: feriado, franco, vacaciones"></div></div><button class="btn" id="ok">Bloquear</button><div id="err"></div></div>' +
    '<div class="lista">' + (bl.map((b) => '<div class="item"><span><b>' + fCorta(b.desde) + ' → ' + fCorta(b.hasta) + '</b><br>' + esc(b.motivo) + ' · ' + esc(b.profesional || b.cabina || 'todo el centro') + '</span><button class="btn sec chico" data-id="' + b.id + '">Quitar</button></div>').join('') || '<p class="muted">No hay bloqueos.</p>') + '</div>';
  $('#ok').onclick = () => conBoton($('#ok'), async () => {
    const q = $('#bq').value, p = { desde: $('#bd').value, hasta: $('#bh').value, motivo: $('#bm').value };
    if (q[0] === 'p') p.profesional_id = +q.slice(1); if (q[0] === 'c') p.cabina_id = +q.slice(1);
    try { const r = await rpc('bloqueo_guardar', { p });
      if (r.afectados.length) { const c = modal('<h3>Bloqueado ✓</h3><p class="aviso">Hay ' + r.afectados.length + ' turno(s) en ese horario. Avisales y reprogramá o cancelá desde la agenda (si cancela el centro, la seña queda a favor).</p><div class="lista">' +
        r.afectados.map((a) => '<div class="item"><span><b>' + esc(a.clienta) + '</b> · ' + fCorta(a.inicio) + '</span>' + (a.celular ? '<a class="btn wa chico" target="_blank" rel="noopener" href="' + wa(a.celular, 'Hola ' + a.clienta.split(' ')[0] + ', te escribimos de Abundia por tu turno del ' + fCorta(a.inicio) + ': tuvimos un imprevisto. ¿Te lo pasamos a otro día?') + '">Avisar</a>' : '') + '</div>').join('') + '</div><button class="btn" id="fin">Listo</button>');
        $('#fin', c).onclick = () => { cerrarModal(); vAjustes($('#vista')); }; } else vAjustes($('#vista'));
    } catch (e) { errorEn($('#err'), e); }
  });
  $$('[data-id]', sv).forEach((b) => b.onclick = () => conBoton(b, async () => { try { await rpc('bloqueo_anular', { p_id: +b.dataset.id }); vAjustes($('#vista')); } catch (e) { errorEn($('#err'), e); } }));
}
async function aConfig(sv) {
  const cfg = await rpc('config_ver'), t = cfg.turnos, e = cfg.empresa, cs = cfg.cuenta_sena || {}, ed = cfg.es_super;
  const num = (id, lbl, v, extra) => '<div class="campo"><label for="' + id + '">' + lbl + '</label><input id="' + id + '" type="number" value="' + (v ?? '') + '"' + (ed ? '' : ' disabled') + (extra || '') + '></div>';
  const txt = (id, lbl, v, ph) => '<div class="campo"><label for="' + id + '">' + lbl + '</label><input id="' + id + '" value="' + esc(v) + '"' + (ph ? ' placeholder="' + ph + '"' : '') + (ed ? '' : ' disabled') + '></div>';
  sv.innerHTML = '<h2>Configuración</h2>' + (ed ? '' : '<p class="aviso">Solo el superusuario cambia la configuración. Acá la podés ver.</p>') +
    '<section class="card"><h3>Reglas de los turnos</h3><div class="grilla">' + num('c1', 'Seña %', t.sena_pct) + num('c2', 'Minutos para pagar la seña', t.plazo_sena_min) + num('c3', 'Horas para anular sin perder la seña', t.cancelacion_horas) +
    num('c4', 'Tolerancia de llegada (min)', t.tolerancia_min) + num('c5', 'Anticipación mínima para reservar (min)', t.anticipacion_min_minutos) + num('c6', 'Se puede reservar hasta (días)', t.reserva_max_dias) +
    '<div class="campo"><label for="c7">Horarios cada</label><select id="c7"' + (ed ? '' : ' disabled') + '>' + [5, 10, 15, 20, 30, 60].map((m) => '<option' + (m === t.intervalo_slots_min ? ' selected' : '') + ' value="' + m + '">' + m + ' min</option>').join('') + '</select></div>' +
    num('c8', 'Turnos esperando seña por clienta', t.max_pendientes_por_celular) +
    num('c11', 'Veces que la clienta puede cambiar un turno', t.reprogramar_max, ' min="0" max="5"') +
    num('c12', 'Si anula a tiempo: horas para elegir el día nuevo (vacío = sin límite)', t.reprogramar_plazo_horas, ' min="1" max="720"') + '</div>' +
    '<label class="check"><input type="checkbox" id="c13"' + (t.reprogramado_pierde_sena ? ' checked' : '') + (ed ? '' : ' disabled') + '> Si anula un turno que ya cambió, pierde la seña</label>' +
    '<label class="check"><input type="checkbox" id="c9"' + (t.permite_elegir_profesional ? ' checked' : '') + (ed ? '' : ' disabled') + '> La clienta elige profesional</label>' +
    '<label class="check"><input type="checkbox" id="c10"' + (t.permite_simultaneos ? ' checked' : '') + (ed ? '' : ' disabled') + '> Permitir servicios al mismo tiempo (con dos profesionales)</label></section>' +
    '<section class="card"><h3>Datos del centro</h3><div class="grilla">' + txt('e1', 'Nombre', e.nombre_fantasia) + txt('e2', 'WhatsApp del centro', (e.whatsapp || '').replace('+549', ''), '387 5123456') + txt('e3', 'Dirección', e.direccion) + txt('e4', 'Instagram', e.instagram, '@abundia') + '</div></section>' +
    '<section class="card"><h3>Cuenta para las señas</h3><div class="grilla">' + txt('s1', 'A nombre de', cs.nombre) + txt('s2', 'Banco / billetera', cs.banco) + txt('s3', 'Alias o CBU', cs.alias) + '</div></section>' +
    (ed ? '<button class="btn" id="ok">Guardar configuración</button>' : '') + '<div id="err"></div>';
  if (!ed) return;
  $('#ok').onclick = () => conBoton($('#ok'), async () => {
    const p = { turnos: { sena_pct: +$('#c1').value, plazo_sena_min: +$('#c2').value, cancelacion_horas: +$('#c3').value, tolerancia_min: +$('#c4').value, anticipacion_min_minutos: +$('#c5').value,
      reserva_max_dias: +$('#c6').value, intervalo_slots_min: +$('#c7').value, max_pendientes_por_celular: +$('#c8').value, permite_elegir_profesional: $('#c9').checked, permite_simultaneos: $('#c10').checked,
      reprogramar_max: +$('#c11').value, reprogramar_plazo_horas: $('#c12').value.trim(), reprogramado_pierde_sena: $('#c13').checked },
      empresa: { nombre_fantasia: $('#e1').value, whatsapp: $('#e2').value, direccion: $('#e3').value, instagram: $('#e4').value },
      cuenta_sena: { nombre: $('#s1').value, banco: $('#s2').value, alias: $('#s3').value } };
    try { await rpc('config_guardar', { p }); CENTRO = null; $('#err').innerHTML = '<p class="aviso ok">Configuración guardada.</p>'; } catch (er) { errorEn($('#err'), er); }
  });
}
async function aUsuarios(sv) {
  const us = await rpc('usuarios_listar');
  const ROL = { super: 'Superusuario', dueno: 'Administradora', operador: 'Recepción', profesional: 'Profesional', mayorista: 'Mayorista' };
  sv.innerHTML = '<h2>Usuarios</h2><div class="lista">' + us.map((u) => '<div class="item"><span><b>' + esc(u.nombre) + '</b> · ' + esc(u.usuario) + '<br><span class="muted">' + (ROL[u.rol] || u.rol) + (u.estado !== 'activo' ? ' · inactivo' : '') +
    (u.ultimo_ingreso ? ' · último ingreso ' + fCorta(u.ultimo_ingreso) : ' · nunca entró') + '</span></span>' + (u.es_yo ? '<span class="chip">vos</span>' : '<span class="fila"><button class="btn sec chico" data-clave="' + u.id + '">Nueva contraseña</button><button class="btn sec chico" data-est="' + u.id + '">' + (u.estado === 'activo' ? 'Desactivar' : 'Activar') + '</button></span>') + '</div>').join('') + '</div>' +
    '<div class="card"><h3>Usuario nuevo</h3><div class="grilla"><div class="campo"><label for="un">Nombre</label><input id="un"></div><div class="campo"><label for="uu">Usuario <span>(para entrar)</span></label><input id="uu" autocapitalize="none"></div>' +
    '<div class="campo"><label for="ur">Permiso</label><select id="ur"><option value="dueno">Administradora</option><option value="super">Superusuario</option></select></div><div class="campo"><label for="uc">Contraseña provisoria <span>(mín. 8)</span></label><input id="uc" type="text" autocomplete="off"></div></div>' +
    '<p class="muted">Al entrar por primera vez el sistema le pide cambiarla.</p><button class="btn" id="ok">Crear usuario</button><div id="err"></div></div>';
  $('#ok').onclick = () => conBoton($('#ok'), async () => { try { await rpc('usuario_guardar', { p: { nombre: $('#un').value, usuario: $('#uu').value, rol: $('#ur').value, clave: $('#uc').value } }); vAjustes($('#vista')); } catch (e) { errorEn($('#err'), e); } });
  $$('[data-clave]', sv).forEach((b) => b.onclick = () => { const u = us.find((x) => x.id === b.dataset.clave);
    const c = modal('<h3>Nueva contraseña para ' + esc(u.nombre) + '</h3><div class="campo"><label for="nc2">Contraseña provisoria</label><input id="nc2" autocomplete="off"></div><p class="muted">Se la pedirá cambiar al entrar.</p><div class="fila"><button class="btn" id="ok2">Guardar</button><button class="btn sec" onclick="cerrarModal()">Volver</button></div><div id="err2"></div>');
    $('#ok2', c).onclick = () => conBoton($('#ok2', c), async () => { try { await rpc('usuario_guardar', { p: { id: u.id, nombre: u.nombre, rol: u.rol, estado: u.estado, clave: $('#nc2', c).value } }); cerrarModal(); vAjustes($('#vista')); } catch (e) { errorEn($('#err2', c), e); } }); });
  $$('[data-est]', sv).forEach((b) => b.onclick = () => conBoton(b, async () => { const u = us.find((x) => x.id === b.dataset.est);
    try { await rpc('usuario_guardar', { p: { id: u.id, nombre: u.nombre, rol: u.rol, estado: u.estado === 'activo' ? 'inactivo' : 'activo' } }); vAjustes($('#vista')); } catch (e) { errorEn($('#err'), e); } }));
}
