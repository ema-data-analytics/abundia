<!doctype html>
<html lang="es"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abundia Recepción</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: panel de trabajo de recepción; barra superior verde; pestañas; agenda del día en columnas por profesional; panel lateral de detalle */
:root {
  --marca: #072519; --oro: #a8834f; --oro-claro: #d8bf98; --oro-suave: #efe5d5;
  --bg: #f3f4ef; --surface: #ffffff; --fg: #13261c; --muted: #5f6b63; --line: #dfe2d9;
  --e-pend: #8a8f88; --e-pend-bg: #f1f2ee; --e-ver: #a0640f; --e-ver-bg: #fbefd8; --e-conf: #2f6b4f; --e-conf-bg: #e2f0e7;
  --e-curso: #7a4fa8; --e-curso-bg: #efe6f8; --e-term: #4f5a54; --e-term-bg: #e9ebe6; --e-aus: #b0412e; --e-aus-bg: #f9e3de;
  --bloq-bg: repeating-linear-gradient(45deg, #e6e8e2 0 6px, #f1f2ee 6px 12px);
  --f-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --oro: #d2b285; --oro-suave: #2b2a1e; --bg: #061e14; --surface: #0c2c1f; --fg: #efe8db; --muted: #a7b2a9; --line: #1f4433;
  --e-pend: #a9afa7; --e-pend-bg: #16352a; --e-ver: #f0c46a; --e-ver-bg: #3a2f14; --e-conf: #8fdcb0; --e-conf-bg: #143a27;
  --e-curso: #cfaef0; --e-curso-bg: #2e2240; --e-term: #b9c2bc; --e-term-bg: #1b3a2d; --e-aus: #f39a86; --e-aus-bg: #3d1f19;
  --bloq-bg: repeating-linear-gradient(45deg, #12301f 0 6px, #0c2c1f 6px 12px); color-scheme: dark } }
:root[data-theme="dark"] {
  --oro: #d2b285; --oro-suave: #2b2a1e; --bg: #061e14; --surface: #0c2c1f; --fg: #efe8db; --muted: #a7b2a9; --line: #1f4433;
  --e-pend: #a9afa7; --e-pend-bg: #16352a; --e-ver: #f0c46a; --e-ver-bg: #3a2f14; --e-conf: #8fdcb0; --e-conf-bg: #143a27;
  --e-curso: #cfaef0; --e-curso-bg: #2e2240; --e-term: #b9c2bc; --e-term-bg: #1b3a2d; --e-aus: #f39a86; --e-aus-bg: #3d1f19;
  --bloq-bg: repeating-linear-gradient(45deg, #12301f 0 6px, #0c2c1f 6px 12px); color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--marca) }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ancho { max-width: 1240px; margin: 0 auto }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; line-height: 1.15 }
p { margin: 0 }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px }
a { color: var(--oro); font-weight: 500 }
.num { font-variant-numeric: tabular-nums }

.top { background: var(--marca); color: var(--oro-claro); padding-block: 10px }
.top .ancho { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.top img { width: 40px; height: auto; border-radius: 8px }
.top h1 { color: #f6efe2; font-size: 1.45rem }
.top .sub { font-size: .8rem; color: var(--oro-claro) }
.top .esp { flex: 1 }
.rol { display: flex; align-items: center; gap: 6px; font-size: .85rem }
.rol select { background: transparent; border: 1px solid var(--oro); color: var(--oro-claro); border-radius: 8px; padding: 4px 8px }
.rol select option { color: #13261c }
.proto { background: var(--oro-suave); font-size: .82rem; padding-block: 7px }
.proto .ancho { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center }
.proto b { color: var(--oro) }
.reloj { display: inline-flex; gap: 8px; align-items: center; margin-left: auto }
.reloj .h { font-weight: 600; font-variant-numeric: tabular-nums }
.mini { border: 1px solid var(--oro); color: var(--fg); background: var(--surface); border-radius: 8px; padding: 3px 10px; font-size: .82rem }

.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 14px 10px }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px }
.tab { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center }
.tab[aria-selected="true"] { background: var(--marca); color: var(--oro-claro) }
.badge { background: var(--e-ver-bg); color: var(--e-ver); border-radius: 999px; font-size: .74rem; padding: 0 7px; font-weight: 600 }
.tab[aria-selected="true"] .badge { background: var(--oro-claro); color: var(--marca) }
.barra .esp { flex: 1 }
.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; background: var(--marca); color: var(--oro-claro) }
.btn.sec { background: var(--surface); color: var(--fg); border: 1px solid var(--line) }
.btn.peligro { background: var(--e-aus-bg); color: var(--e-aus) }
.btn:disabled { opacity: .45; cursor: not-allowed }
:root[data-theme="dark"] .btn:not(.sec):not(.peligro), :root[data-theme="dark"] .tab[aria-selected="true"] { background: var(--oro); color: var(--marca) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.sec):not(.peligro), :root:not([data-theme="light"]) .tab[aria-selected="true"] { background: var(--oro); color: var(--marca) } }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px }
.kpi span { font-size: .78rem; color: var(--muted) }
.kpi b { font-size: 1.25rem; font-variant-numeric: tabular-nums; font-weight: 600 }
.alerta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--e-aus-bg); color: var(--e-aus); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-weight: 500 }

.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted); margin-bottom: 8px }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px }
.agenda-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px }
.agenda { display: grid; grid-template-columns: 54px repeat(3, minmax(170px, 1fr)); min-width: 590px }
.ag-cab { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px; font-weight: 600; z-index: 2; display: flex; gap: 8px; align-items: center }
.ag-cab i { width: 10px; height: 10px; border-radius: 50% }
.ag-horas, .ag-col { position: relative }
.ag-col { border-left: 1px solid var(--line) }
.ag-hora { position: absolute; left: 0; right: 0; font-size: .72rem; color: var(--muted); text-align: right; padding-right: 8px; transform: translateY(-7px); font-variant-numeric: tabular-nums }
.ag-linea { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line) }
.ag-linea.media { border-top-style: dashed; opacity: .6 }
.ahora { position: absolute; left: 0; right: 0; border-top: 2px solid var(--e-aus); z-index: 3 }
.ahora::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--e-aus) }
.bloque { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 4px 8px; font-size: .78rem; overflow: hidden; text-align: left; border: 0; border-left: 4px solid; line-height: 1.25; z-index: 1 }
.bloque b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bloque span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85 }
.bloque:hover { filter: brightness(.97); z-index: 2 }
.st-pendiente_sena { background: var(--e-pend-bg); color: var(--e-pend); border-color: var(--e-pend); border-style: dashed; border-left-style: solid }
.st-sena_a_verificar { background: var(--e-ver-bg); color: var(--e-ver); border-color: var(--e-ver) }
.st-confirmado { background: var(--e-conf-bg); color: var(--e-conf); border-color: var(--e-conf) }
.st-en_curso { background: var(--e-curso-bg); color: var(--e-curso); border-color: var(--e-curso) }
.st-terminado { background: var(--e-term-bg); color: var(--e-term); border-color: var(--e-term) }
.st-ausente { background: var(--e-aus-bg); color: var(--e-aus); border-color: var(--e-aus); text-decoration: line-through }
.bloqueo { position: absolute; left: 4px; right: 4px; border-radius: 8px; background: var(--bloq-bg); color: var(--muted); font-size: .76rem; padding: 4px 8px; border: 1px dashed var(--line) }
.demorada { outline: 2px solid var(--e-aus); outline-offset: 1px }

.lista { display: grid; gap: 8px }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center }
.item .t { font-weight: 600 }
.item .d { color: var(--muted); font-size: .88rem }
.item .acc { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end }
@media (max-width: 640px) { .item { grid-template-columns: 1fr } .item .acc { justify-content: flex-start } }
.vacio { padding: 18px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .76rem; font-weight: 600; border: 0 }

.semana { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.sdia { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px }
.sdia h3 { font-size: 1.2rem }
.sprof { display: grid; gap: 3px; font-size: .82rem }
.sbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden }
.sbar i { display: block; height: 100% }

/* Panel lateral y modales */
.velo { position: fixed; inset: 0; background: rgba(4,20,13,.5); z-index: 50; display: flex; justify-content: flex-end }
.panel { background: var(--surface); width: min(440px, 100%); height: 100%; overflow-y: auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; display: grid; gap: 14px; align-content: start; padding-top: calc(18px + env(safe-area-inset-top, 0px)) }
.panel .cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.panel h2 { font-size: 1.7rem }
.cerrar { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px }
.dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: .92rem; margin: 0 }
.dl dt { color: var(--muted) }
.dl dd { margin: 0 }
.tabla { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums }
.tabla td, .tabla th { padding: 6px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
.tabla th { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.tabla td:last-child, .tabla th:last-child { text-align: right; white-space: nowrap }
.tabla tfoot td { border-bottom: 0; font-weight: 600 }
.acciones { display: grid; gap: 8px }
.campo { display: grid; gap: 4px }
.campo label { font-size: .86rem; font-weight: 500 }
.campo input, .campo select, .campo textarea { padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100% }
.campo .ayuda { font-size: .78rem; color: var(--muted) }
.error { color: var(--e-aus); font-size: .85rem }
.medio { display: grid; grid-template-columns: 1fr 120px auto; gap: 6px }
.comanda { border: 1px dashed var(--muted); border-radius: 12px; padding: 14px; display: grid; gap: 8px; font-size: .9rem; background: var(--bg) }
.comanda .pie { text-align: center; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px }
.wa { background: #e7ddd3; color: #111b21; border-radius: 12px; padding: 10px; display: grid; gap: 6px }
.wa .msg { background: #fff; border-radius: 0 10px 10px 10px; padding: 9px 11px; font-size: .86rem; white-space: pre-wrap }
.wa small { color: #54656f }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--marca); color: var(--oro-claro); padding: 10px 16px; border-radius: 10px; z-index: 70; font-weight: 500; max-width: 90vw }
.nota { font-size: .8rem; color: var(--muted) }
</style>

      var suma = filas.reduce(function (a, f) { return a + (+f[1] || 0); }, 0), dif = saldo - suma;
      capa('<div class="cab"><h2>Cobrar</h2><button class="cerrar" type="button">Cerrar</button></div><p>' + x.nro + ' · ' + esc(x.clienta) + '</p>' +
        '<table class="tabla"><tbody><tr><td>Total de servicios</td><td>' + pesos(totalDe(x)) + '</td></tr><tr><td>Seña ya pagada</td><td>− ' + pesos(x.senaPagada || 0) + '</td></tr></tbody><tfoot><tr><td>Saldo a cobrar</td><td>' + pesos(saldo) + '</td></tr></tfoot></table>' +
        '<div class="campo"><label>Medios de pago</label>' + filas.map(function (f, i) {
          return '<div class="medio"><select data-i="' + i + '" aria-label="Medio">' + MEDIOS.map(function (m) { return '<option' + (m === f[0] ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select>' +
            '<input type="number" min="0" step="100" data-m="' + i + '" value="' + f[1] + '" aria-label="Importe">' + (filas.length > 1 ? '<button class="cerrar" type="button" data-x="' + i + '" aria-label="Quitar">✕</button>' : '<span></span>') + '</div>'; }).join('') +
        '<button class="btn sec" type="button" id="mas-medio" style="justify-self:start">+ Otro medio</button><span class="ayuda">Se puede pagar con varios medios (ej.: parte efectivo y parte transferencia).</span></div>' +
        (dif !== 0 ? '<p class="error">' + (dif > 0 ? 'Faltan ' + pesos(dif) : 'Sobran ' + pesos(-dif)) + ' para completar el saldo.</p>' : '') +
        '<button class="btn" id="ok-cobro"' + (dif !== 0 ? ' disabled' : '') + '>Cobrar ' + pesos(saldo) + ' y terminar el turno</button>', function () {
          $('capa').querySelectorAll('select[data-i]').forEach(function (s) { s.addEventListener('change', function () { filas[+s.dataset.i][0] = s.value; }); });
          $('capa').querySelectorAll('input[data-m]').forEach(function (s) { s.addEventListener('change', function () { filas[+s.dataset.m][1] = +s.value || 0; dibujar(); }); });
          $('capa').querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', function () { filas.splice(+b.dataset.x, 1); dibujar(); }); });
          $('mas-medio').addEventListener('click', function () { filas.push(['Transferencia', Math.max(0, saldo - filas.reduce(function (a, f) { return a + f[1]; }, 0))]); dibujar(); });
          $('ok-cobro').addEventListener('click', function () {
            x.cobro = { medios: filas.filter(function (f) { return f[1] > 0; }), nro: 'V-000' + (nroV++) }; x.estado = 'terminado'; render(); comanda(x); toast('Cobrado ' + pesos(saldo) + ': turno terminado');
          });
        });
    }
    dibujar();
  }
  function comanda(x) {
    var sp = x.senaPagada || 0;
    capa('<div class="cab"><h2>Comprobante</h2><button class="cerrar" type="button">Cerrar</button></div>' +
      '<div class="comanda"><b>ABUNDIA · Centro de estética integral</b><span>' + x.cobro.nro + ' · Turno ' + x.nro + ' · ' + fechaLarga(hoy()) + '</span><span>Clienta: ' + esc(x.clienta) + '</span>' +
      '<table class="tabla"><tbody>' + x.items.map(function (it) { return '<tr><td>' + esc(SERV[it.s].nombre) + ' (' + prof(it.p).nombre + ')</td><td>' + pesos(SERV[it.s].precio) + '</td></tr>'; }).join('') +
      '<tr><td>Seña aplicada</td><td>− ' + pesos(sp) + '</td></tr></tbody><tfoot><tr><td>Cobrado</td><td>' + pesos(totalDe(x) - sp) + '</td></tr></tfoot></table>' +
      '<span class="nota">Pagó con: ' + x.cobro.medios.map(function (m) { return m[0] + ' ' + pesos(m[1]); }).join(' + ') + '</span>' +
      '<div class="pie">Comprobante no válido como factura · Constancia interna de control</div></div>' +
      '<a class="btn sec" style="text-align:center;text-decoration:none" href="' + wa(x.cel, 'Hola ' + x.clienta.split(' ')[0] + ', gracias por venir a Abundia. Tu comprobante ' + x.cobro.nro + ': ' + pesos(totalDe(x) - sp) + ' (seña aplicada ' + pesos(sp) + '). Comprobante no válido como factura.') + '" target="_blank" rel="noopener">Enviar por WhatsApp</a>');
  }

  // ---------- Nuevo turno (recepción) y bloqueos
  function nuevo() {
    var st = { cli: '', cel: '', s: 'limpieza', p: '', ini: null, sena: 'pide', motivo: '' };
    function horas() {
      var out = [], dur = SERV[st.s].dur, ps = st.p ? [st.p] : PROFS.filter(function (p) { return p.cats.indexOf(SERV[st.s].cat) !== -1; }).map(function (p) { return p.id; });
      for (var m = Math.ceil((reloj + 30) / 15) * 15; m + dur <= CIERRA; m += 15) { for (var j = 0; j < ps.length; j++) if (libre(ps[j], m, m + dur)) { out.push([m, ps[j]]); break; } }
      return out;
    }
    function dibujar(err) {
      var hs = horas(), aptas = PROFS.filter(function (p) { return p.cats.indexOf(SERV[st.s].cat) !== -1; });
      if (st.p && !aptas.some(function (p) { return p.id === st.p; })) st.p = '';
      capa('<div class="cab"><h2>Nuevo turno</h2><button class="cerrar" type="button">Cerrar</button></div><p class="nota">Para turnos pedidos por teléfono o en el local. Va a la misma agenda que la web.</p>' +
        '<div class="campo"><label for="n-cli">Clienta</label><input id="n-cli" value="' + esc(st.cli) + '" placeholder="Nombre y apellido"><span class="ayuda">En el sistema real busca a la clienta por nombre o celular.</span></div>' +
        '<div class="campo"><label for="n-cel">Celular</label><input id="n-cel" type="tel" value="' + esc(st.cel) + '" placeholder="387 5111111"></div>' +
        '<div class="campo"><label for="n-s">Servicio</label><select id="n-s">' + Object.keys(SERV).map(function (k) { return '<option value="' + k + '"' + (k === st.s ? ' selected' : '') + '>' + SERV[k].nombre + ' · ' + SERV[k].dur + ' min</option>'; }).join('') + '</select></div>' +
        '<div class="campo"><label for="n-p">Profesional</label><select id="n-p"><option value="">Cualquiera disponible</option>' + aptas.map(function (p) { return '<option value="' + p.id + '"' + (p.id === st.p ? ' selected' : '') + '>' + p.nombre + '</option>'; }).join('') + '</select></div>' +
        '<div class="campo"><label for="n-h">Horario libre hoy</label><select id="n-h">' + (hs.length ? hs.map(function (h) { return '<option value="' + h[0] + '|' + h[1] + '">' + hm(h[0]) + ' · ' + prof(h[1]).nombre + '</option>'; }).join('') : '<option value="">Sin horarios libres hoy</option>') + '</select></div>' +
        '<div class="campo"><label for="n-sena">Seña</label><select id="n-sena"><option value="pide"' + (st.sena === 'pide' ? ' selected' : '') + '>Pedir seña del ' + CFG.sena + ' % (' + pesos(Math.round(SERV[st.s].precio * CFG.sena / 100 / 100) * 100) + ')</option>' +
        '<option value="pagada"' + (st.sena === 'pagada' ? ' selected' : '') + '>Ya pagó la seña (en el local)</option><option value="exenta"' + (st.sena === 'exenta' ? ' selected' : '') + (rol !== 'duena' ? ' disabled' : '') + '>Sin seña (solo la dueña, con motivo)</option></select>' +
        (rol !== 'duena' ? '<span class="ayuda">Exceptuar la seña lo puede hacer solo la dueña.</span>' : '') + '</div>' +
        (st.sena === 'exenta' ? '<div class="campo"><label for="n-mot">Motivo</label><input id="n-mot" value="' + esc(st.motivo) + '" placeholder="Ej.: clienta frecuente"></div>' : '') +
        (err ? '<p class="error">' + err + '</p>' : '') + '<button class="btn" id="n-ok">Guardar turno</button>', function () {
          $('n-cli').addEventListener('input', function (e) { st.cli = e.target.value; });
          $('n-cel').addEventListener('input', function (e) { st.cel = e.target.value; });
          $('n-s').addEventListener('change', function (e) { st.s = e.target.value; dibujar(); });
          $('n-p').addEventListener('change', function (e) { st.p = e.target.value; dibujar(); });
          $('n-sena').addEventListener('change', function (e) { st.sena = e.target.value; dibujar(); });
          if ($('n-mot')) $('n-mot').addEventListener('input', function (e) { st.motivo = e.target.value; });
          $('n-ok').addEventListener('click', function () {
            var d = String(st.cel).replace(/\D/g, ''); if (d.charAt(0) === '0') d = d.slice(1); if (d.length === 12) d = d.replace(/^(\d{3})15/, '$1');
            var h = $('n-h').value;
            if (!st.cli.trim()) return dibujar('Falta el nombre de la clienta.');
            if (d.length !== 10) return dibujar('Revisá el celular: código de área + número (10 dígitos).');
            if (!h) return dibujar('No hay horario libre para ese servicio hoy.');
            if (st.sena === 'exenta' && !st.motivo.trim()) return dibujar('Para turno sin seña hace falta el motivo.');
            var x = { clienta: st.cli.trim(), cel: '+549' + d, origen: 'recepcion', items: [{ s: st.s, p: h.split('|')[1], ini: +h.split('|')[0] }] };
            init(x);
            if (st.sena === 'pide') { x.estado = 'pendiente_sena'; x.vence = reloj + CFG.plazo; }
            else if (st.sena === 'pagada') { x.estado = 'confirmado'; x.senaPagada = x.sena; x.senaHoy = x.sena; }
            else { x.estado = 'confirmado'; x.sena = 0; x.senaPagada = 0; x.motivo = 'Sin seña: ' + st.motivo; }
            T.push(x); vista = 'dia'; render(); abrirTurno(x); toast('Turno ' + x.nro + ' guardado');
          });
        });
    }
    dibujar();
  }
  function bloquear() {
    function dibujar(err) {
      capa('<div class="cab"><h2>Bloquear horario</h2><button class="cerrar" type="button">Cerrar</button></div><p class="nota">Francos, almuerzo, capacitación o una cabina fuera de servicio. Esos horarios no se ofrecen en la web.</p>' +
        '<div class="campo"><label for="b-p">Profesional</label><select id="b-p">' + PROFS.map(function (p) { return '<option value="' + p.id + '">' + p.nombre + '</option>'; }).join('') + '</select></div>' +
        '<div class="campo"><label for="b-d">Desde</label><select id="b-d">' + opciones(ABRE, CIERRA - 15) + '</select></div>' +
        '<div class="campo"><label for="b-h">Hasta</label><select id="b-h">' + opciones(ABRE + 15, CIERRA) + '</select></div>' +
        '<div class="campo"><label for="b-m">Motivo</label><input id="b-m" value="Capacitación"></div>' + (err ? '<p class="error">' + err + '</p>' : '') +
        '<button class="btn" id="b-ok">Bloquear</button>', function () {
          $('b-d').value = String(16 * 60); $('b-h').value = String(17 * 60);
          $('b-ok').addEventListener('click', function () {
            var p = $('b-p').value, a = +$('b-d').value, b = +$('b-h').value;
            if (b <= a) return dibujar('"Hasta" tiene que ser después de "Desde".');
            var choca = T.filter(function (x) { return x.dia === 0 && ['pendiente_sena', 'sena_a_verificar', 'confirmado', 'en_curso'].indexOf(x.estado) !== -1 && x.items.some(function (it) { return it.p === p && a < fin(it) && b > it.ini; }); });
            if (choca.length) return dibujar('Ese horario tiene turnos: ' + choca.map(function (x) { return x.nro + ' ' + x.clienta; }).join(', ') + '. Reprogramalos o cancelalos antes de bloquear.');
            BLOQ.push({ p: p, ini: a, fin: b, motivo: $('b-m').value || 'Bloqueado' }); cerrarCapa(); vista = 'dia'; render(); toast('Horario bloqueado');
          });
        });
    }
    dibujar();
  }
  function opciones(a, b) { var s = ''; for (var m = a; m <= b; m += 15) s += '<option value="' + m + '">' + hm(m) + '</option>'; return s; }

  // ---------- Eventos generales
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { vista = b.dataset.v; render(); }); });
  $('b-nuevo').addEventListener('click', nuevo);
  $('b-bloquear').addEventListener('click', bloquear);
  $('rol').addEventListener('change', function (e) { rol = e.target.value; render(); toast(rol === 'duena' ? 'Ahora ves lo que ve la dueña' : 'Ahora ves lo que ve recepción'); });
  $('avanzar').addEventListener('click', function () {
    reloj = Math.min(CIERRA, reloj + 15); var c = automaticos(); render();
    if (c.length) toast(c.join(' · '));
  });
  automaticos(); render();
})();
</script>
