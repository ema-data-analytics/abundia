<!doctype html>
<html lang="es"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abundia Turnos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: pantalla pública de turnos, una columna angosta pensada para celular; cabecera verde del logo; barra de resumen fija abajo */
:root {
  --marca: #072519; --marca-2: #0d3425; --oro: #a8834f; --oro-claro: #d8bf98; --oro-suave: #efe5d5;
  --bg: #f3f4ef; --surface: #ffffff; --fg: #13261c; --muted: #5f6b63; --line: #dfe2d9;
  --ok: #2f7a4f; --ok-suave: #e3f1e8; --alerta: #a0522d; --alerta-suave: #f7e8de;
  --f-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --f-body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --oro: #d2b285; --oro-suave: #2b2a1e; --bg: #061e14; --surface: #0c2c1f; --fg: #efe8db; --muted: #a7b2a9; --line: #1f4433;
  --ok: #7fd1a0; --ok-suave: #143a27; --alerta: #f0a37a; --alerta-suave: #3a2418; color-scheme: dark } }
:root[data-theme="dark"] {
  --oro: #d2b285; --oro-suave: #2b2a1e; --bg: #061e14; --surface: #0c2c1f; --fg: #efe8db; --muted: #a7b2a9; --line: #1f4433;
  --ok: #7fd1a0; --ok-suave: #143a27; --alerta: #f0a37a; --alerta-suave: #3a2418; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
a { color: var(--oro); font-weight: 500 }
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--marca) }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.col { max-width: 560px; margin: 0 auto }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; line-height: 1.15; text-wrap: balance }
p { margin: 0 }
button { font: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .serv:focus-within { outline: 2px solid var(--oro); outline-offset: 2px }

/* Cabecera */
.cabecera { background: var(--marca); color: var(--oro-claro); padding-block: 14px 18px; text-align: center }
.cabecera img { width: min(230px, 62vw); height: auto; display: block; margin: 0 auto;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%) }
.proto { background: var(--oro-suave); color: var(--fg); font-size: 0.82rem; padding-block: 8px; text-align: center; border-bottom: 1px solid var(--line) }
.proto b { color: var(--oro) }

/* Pasos */
.pasos { display: flex; gap: 6px; padding-block: 16px 4px; list-style: none; margin: 0 }
.pasos li { flex: 1; height: 4px; border-radius: 2px; background: var(--line) }
.pasos li.hecho { background: var(--oro) }
.paso-titulo { padding-block: 14px 6px; display: grid; gap: 4px }
.paso-titulo .num { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--oro); font-weight: 600 }
.paso-titulo h2 { font-size: 1.85rem }
.paso-titulo p { color: var(--muted); font-size: 0.95rem }
main { padding-bottom: 130px }
.vista { display: grid; gap: 14px; padding-block: 8px 24px }

/* Servicios */
.cat { display: grid; gap: 8px }
.cat h3 { font-size: 1.3rem; color: var(--fg); padding-top: 8px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline }
.cat:first-child h3 { border-top: 0; padding-top: 0 }
.cat h3 small { font-family: var(--f-body); font-size: 0.78rem; color: var(--muted); font-weight: 400 }
.serv { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: border-color .15s }
.serv input { position: absolute; opacity: 0; pointer-events: none }
.check { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--oro); display: grid; place-items: center; color: transparent; font-size: 14px; transition: background .15s }
.serv.sel { border-color: var(--oro) }
.serv.sel .check { background: var(--oro); color: var(--surface) }
.serv .nom { font-weight: 500; min-width: 0 }
.serv .det { font-size: 0.82rem; color: var(--muted) }
.serv .precio { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap }

/* Profesional */
.elige { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px }
.elige .nom { font-weight: 600 }
.opciones { display: flex; flex-wrap: wrap; gap: 8px }
.op { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 7px 14px; font-size: 0.92rem }
.op[aria-pressed="true"] { background: var(--marca); color: var(--oro-claro); border-color: var(--marca) }
:root[data-theme="dark"] .op[aria-pressed="true"], :root[data-theme="dark"] .hora[aria-pressed="true"] { background: var(--oro); color: var(--marca); border-color: var(--oro) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .op[aria-pressed="true"], :root:not([data-theme="light"]) .hora[aria-pressed="true"] { background: var(--oro); color: var(--marca); border-color: var(--oro) } }

/* Calendario y horarios */
.dias { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory }
.dia { flex: 0 0 64px; scroll-snap-align: start; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 8px 4px; display: grid; gap: 2px; text-align: center }
.dia .d1 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted) }
.dia .d2 { font-family: var(--f-display); font-size: 1.6rem; font-weight: 600; line-height: 1 }
.dia .d3 { font-size: 0.72rem; color: var(--muted) }
.dia[aria-pressed="true"] { border-color: var(--oro); box-shadow: inset 0 0 0 1px var(--oro) }
.dia:disabled { opacity: 0.4; cursor: not-allowed }
.horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px }
.hora { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 0; font-variant-numeric: tabular-nums; font-weight: 500 }
.hora[aria-pressed="true"] { background: var(--marca); color: var(--oro-claro); border-color: var(--marca) }
.vacio { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 0.92rem }
.plan .fila { display: grid; grid-template-columns: 52px 1fr; gap: 10px }
.plan .t { font-variant-numeric: tabular-nums; color: var(--oro); font-weight: 600 }

/* Formulario */
.campo { display: grid; gap: 5px }
.campo label { font-size: 0.88rem; font-weight: 500 }
.campo label span { color: var(--muted); font-weight: 400 }
.campo input, .campo textarea { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); width: 100% }
.campo .ayuda { font-size: 0.8rem; color: var(--muted) }
.campo .error { font-size: 0.82rem; color: var(--alerta) }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
@media (max-width: 420px) { .dos { grid-template-columns: 1fr } }
.politica { background: var(--oro-suave); border-radius: 12px; padding: 12px 14px; font-size: 0.88rem; display: grid; gap: 6px }
.politica ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px }
.acepto { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem }
.acepto input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--marca) }

/* Seña */
.reloj { background: var(--marca); color: var(--oro-claro); border-radius: 14px; padding: 16px; display: grid; gap: 4px; text-align: center }
.reloj .min { font-family: var(--f-display); font-size: 2.8rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: #fff }
.reloj p { font-size: 0.88rem }
.datos-pago { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; display: grid }
.dp { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line) }
.dp:last-child { border-bottom: 0 }
.dp .k { font-size: 0.82rem; color: var(--muted) }
.dp .v { font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-all }
.copiar { border: 1px solid var(--oro); color: var(--oro); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 0.82rem; white-space: nowrap }
.subir { position: relative; border: 1.5px dashed var(--oro); border-radius: 12px; padding: 18px; text-align: center; display: grid; gap: 6px; background: var(--surface) }
.subir input { position: absolute; width: 1px; height: 1px; opacity: 0 }
.subir .elegir { justify-self: center; border: 1px solid var(--oro); color: var(--oro); border-radius: 10px; padding: 9px 16px; font-weight: 600; cursor: pointer }
.subir input:focus-visible + .elegir { outline: 2px solid var(--oro); outline-offset: 2px }
.subir .archivo { font-weight: 600; color: var(--ok) }

/* Confirmación */
.estado { display: inline-flex; gap: 6px; align-items: center; background: var(--alerta-suave); color: var(--alerta); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; font-weight: 600; justify-self: start }
.estado.ok { background: var(--ok-suave); color: var(--ok) }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px }
.ticket .nro { font-family: var(--f-display); font-size: 1.5rem }
.ticket .linea { display: flex; justify-content: space-between; gap: 10px; font-size: 0.92rem }
.ticket .linea span:last-child { font-variant-numeric: tabular-nums; text-align: right }
.ticket hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0 }

/* Barra inferior */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 12px; box-shadow: 0 -6px 20px rgba(7,37,25,.08) }
.barra .col { display: flex; align-items: center; gap: 12px }
.barra .res { flex: 1; min-width: 0; font-size: 0.85rem; color: var(--muted) }
.barra .res b { display: block; color: var(--fg); font-size: 1.05rem; font-variant-numeric: tabular-nums }
.barra .res, .barra .res b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
@media (max-width: 420px) { .barra .btn { padding: 13px 14px } .barra .col { gap: 8px } }
.btn { border: 0; border-radius: 12px; padding: 13px 20px; font-weight: 600; background: var(--marca); color: var(--oro-claro); white-space: nowrap }
:root[data-theme="dark"] .btn { background: var(--oro); color: var(--marca) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { background: var(--oro); color: var(--marca) } }
.btn:disabled { opacity: 0.4; cursor: not-allowed }
.btn-sec { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 12px; padding: 12px 14px }

/* Opciones a decidir */
.decidir-btn { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 25;
  background: var(--oro); color: var(--marca); border: 0; border-radius: 999px; padding: 7px 13px; font-size: 0.8rem; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.25) }
.hoja { position: fixed; inset: 0; z-index: 40; background: rgba(4,20,13,.55); display: grid; align-items: end }
.hoja[hidden] { display: none !important }
.hoja .panel { background: var(--surface); border-radius: 18px 18px 0 0; max-height: 88vh; overflow-y: auto; width: 100%; max-width: 560px; margin: 0 auto;
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px }
.hoja h3 { font-size: 1.5rem }
.hoja .intro { font-size: 0.88rem; color: var(--muted) }
.decision { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line) }
.decision label { font-weight: 500; font-size: 0.95rem }
.decision select { font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg) }
.sin-barra .barra { display: none }
.sin-barra main { padding-bottom: 32px }
.hero { display: grid; gap: 12px; padding-top: 6px }
.hero h2 { font-size: 2.2rem }
.hero p { color: var(--muted) }
.hero-btns { display: flex; flex-wrap: wrap; gap: 10px }
.como { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px }
.como h3 { font-size: 1.35rem }
.como ol { margin: 0; padding: 0; list-style: none; counter-reset: c; display: grid; gap: 12px }
.como li { counter-increment: c; display: grid; grid-template-columns: 30px 1fr; column-gap: 10px }
.como li::before { content: counter(c); grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--oro); color: var(--oro); display: grid; place-items: center; font-size: .85rem; font-weight: 600 }
.como li span { color: var(--muted); font-size: .9rem }
.info { display: grid; gap: 8px; font-size: .92rem }
.info div { display: grid; grid-template-columns: 92px 1fr; gap: 10px }
.info .k, .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--oro); font-weight: 600; padding-top: 2px }
.nota-peq { font-size: .82rem; color: var(--muted) }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .85em; word-break: break-all }
.constancia { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; border-top: 4px solid var(--oro) }
.c-cab { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.c-cab img { width: 54px; height: auto; border-radius: 10px; background: var(--marca) }
.c-cab > div { display: grid; flex: 1; min-width: 140px }
.c-cab .nro { font-family: var(--f-display); font-size: 1.8rem; font-weight: 600; line-height: 1.1 }
.c-estado { font-size: .95rem }
.c-datos { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px }
.c-datos div { display: grid; min-width: 0 }
.c-datos dt { font-size: .75rem; color: var(--muted) }
.c-datos dd { margin: 0; font-weight: 500 }
.c-tabla { width: 100%; border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums }
.c-tabla th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--line) }
.c-tabla td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top }
.c-tabla td:first-child { width: 52px; color: var(--oro); font-weight: 600 }
.c-tabla th:last-child, .c-tabla td:last-child { text-align: right; white-space: nowrap }
.c-tabla small { color: var(--muted) }
.c-tabla tfoot td { border-bottom: 0; padding: 4px 0 }
.c-tabla tfoot .saldo td { font-weight: 700; font-size: 1rem; padding-top: 8px; border-top: 1px solid var(--line) }
.no-factura { text-align: center; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px }
.acciones { display: grid; gap: 8px }
.accion { display: block; text-align: center; text-decoration: none; border: 1px solid var(--oro); color: var(--fg); background: var(--surface); border-radius: 12px; padding: 12px; font-weight: 500 }
.accion:hover { background: var(--oro-suave) }
.demo { border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px }
.btn-demo { border: 1px dashed var(--oro); background: transparent; color: var(--oro); border-radius: 10px; padding: 10px; font-weight: 600 }
.wa { background: #e7ddd3; border-radius: 14px; padding: 12px; display: grid; gap: 8px; color: #111b21 }
.wa-cab { display: flex; gap: 10px; align-items: center; font-size: .9rem }
.wa-cab small { color: #54656f }
.wa-av { width: 34px; height: 34px; border-radius: 50%; background: #072519; color: #d8bf98; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600 }
.wa-msg { background: #ffffff; border-radius: 0 10px 10px 10px; padding: 10px 12px; font-size: .9rem; line-height: 1.45; max-width: 92%; box-shadow: 0 1px 1px rgba(0,0,0,.12) }
.wa .nota-peq { color: #54656f }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

<script>
(function () {
  'use strict';
  // ---------- Datos de ejemplo (servicios reales de Abundia; precios, duraciones y profesionales de ejemplo)
  var CATS = [
    { id: 'pc', nombre: 'Pestañas y cejas', s: [
      ['lash-conv', 'Lash lifting convencional', 60, 25000], ['lash-cor', 'Lash lifting coreano', 75, 30000],
      ['cejas', 'Laminado y perfilado de cejas', 45, 22000]] },
    { id: 'fa', nombre: 'Facial', s: [
      ['dermapen', 'Dermapen', 60, 45000], ['limpieza', 'Limpieza facial', 60, 30000],
      ['radio', 'Radiofrecuencia', 45, 28000], ['alta', 'Alta frecuencia', 30, 18000]] },
    { id: 'ma', nombre: 'Manicuría', s: [
      ['semi-m', 'Esmaltado semipermanente', 60, 15000], ['kapping', 'Kapping gel', 75, 20000],
      ['soft', 'Soft gel', 90, 25000], ['belleza-m', 'Belleza de manos', 40, 12000], ['remocion', 'Remoción con manicuría', 30, 8000]] },
    { id: 'pe', nombre: 'Pedicuría', s: [['semi-p', 'Esmaltado semipermanente con belleza de pies', 75, 22000]] },
    { id: 'co', nombre: 'Tratamiento corporal', s: [['mioup', 'Mío Up', 60, 35000]] },
    { id: 'de', nombre: 'Depilación', s: [['definitiva', 'Depilación definitiva', 45, 30000, 'por zona'], ['espanol', 'Sistema español (con cera)', 30, 12000, 'por zona']] },
    { id: 'la', nombre: 'Labios', s: [['hidra', 'Hidra Lips', 45, 25000], ['bb', 'BB Lips', 60, 28000]] },
    { id: 'mz', nombre: 'Masajes', s: [['mas-rel', 'Masaje relajante', 60, 28000, 'tipos de masaje a definir'], ['mas-desc', 'Masaje descontracturante', 60, 30000, 'tipos de masaje a definir']] }
  ];
  var PROFS = [
    { id: 'v', nombre: 'Valentina', cats: ['pc', 'fa', 'la', 'mz'] },
    { id: 'c', nombre: 'Camila', cats: ['ma', 'pe', 'pc'] },
    { id: 'l', nombre: 'Lucía', cats: ['de', 'co', 'fa', 'ma', 'mz'] }
  ];
  var ALIAS = 'abundia.estetica.mp', TITULAR = 'Abundia Estética', WSP = '+54 9 387 000-0000';
  var SERV = {}; CATS.forEach(function (c) { c.s.forEach(function (x) { SERV[x[0]] = { id: x[0], nombre: x[1], dur: x[2], precio: x[3], nota: x[4] || '', cat: c.id }; }); });

  var cfg = { elige: true, sena: 30, plazo: 30, anula: 3, antic: 120 };
  function nuevoEstado(nro) { return { modo: 'inicio', paso: 0, sel: [], prof: {}, dia: null, hora: null, plan: null, datos: { nombre: '', apellido: '', cel: '', email: '', nac: '', nota: '' }, acepto: false, vence: null, archivo: '', nro: nro, estado: '', token: '', pedido: '' }; }
  var st = nuevoEstado('T-0042');
  var timer = null, prev = null;

  // ---------- Utilidades
  function $(id) { return document.getElementById(id); }
  function pesos(n) { return '$ ' + Math.round(n).toLocaleString('es-AR'); }
  function hm(min) { var h = Math.floor(min / 60), m = min % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
  function durTxt(min) { var h = Math.floor(min / 60), m = min % 60; return (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : ''); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function total() { return st.sel.reduce(function (a, id) { return a + SERV[id].precio; }, 0); }
  function durTotal() { return st.sel.reduce(function (a, id) { return a + SERV[id].dur; }, 0); }
  function sena() { return Math.round(total() * cfg.sena / 100 / 100) * 100; }
  function profsDe(id) { return PROFS.filter(function (p) { return p.cats.indexOf(SERV[id].cat) !== -1; }); }
  function nomProf(id) { for (var i = 0; i < PROFS.length; i++) if (PROFS[i].id === id) return PROFS[i].nombre; return ''; }
  var DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'], MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  function fechaLarga(d) { return ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][d.getDay()] + ' ' + d.getDate() + ' de ' + ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][d.getMonth()]; }
  function horario(d) { var w = d.getDay(); if (w === 0) return null; return w === 6 ? [540, 840] : [540, 1200]; } // Lun-Vie 9-20, Sáb 9-14 (ejemplo)

  // Agenda ocupada de ejemplo: generada de forma fija por día y profesional.
  function rng(seed) { return function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; }
  var ocupado = {};
  function ocupadoDe(d, pid) {
    var k = d.toDateString() + pid; if (ocupado[k]) return ocupado[k];
    var r = rng(d.getDate() * 31 + d.getMonth() * 7 + pid.charCodeAt(0)), h = horario(d), lista = [];
    if (h) { var n = 2 + Math.floor(r() * 3); for (var i = 0; i < n; i++) { var ini = h[0] + Math.floor(r() * ((h[1] - h[0]) / 15 - 4)) * 15; lista.push([ini, ini + 45 + Math.floor(r() * 3) * 15]); } }
    return (ocupado[k] = lista);
  }
  function libre(d, pid, a, b) { return ocupadoDe(d, pid).every(function (x) { return b <= x[0] || a >= x[1]; }); }
  // Servicios seguidos: cada uno empieza cuando termina el anterior, con una profesional libre que lo haga.
  function planPara(d, inicio) {
    var t = inicio, plan = [], h = horario(d);
    for (var i = 0; i < st.sel.length; i++) {
      var id = st.sel[i], dur = SERV[id].dur, elegida = cfg.elige ? st.prof[id] : '';
      var cand = elegida ? [elegida] : profsDe(id).map(function (p) { return p.id; });
      var p = null;
      for (var j = 0; j < cand.length; j++) if (libre(d, cand[j], t, t + dur)) { p = cand[j]; break; }
      if (!p) return null;
      plan.push({ id: id, prof: p, ini: t, fin: t + dur }); t += dur;
    }
    return t <= h[1] ? plan : null;
  }
  function horasDe(d) {
    var h = horario(d); if (!h) return [];
    var ahora = new Date(), min = -1;
    if (d.toDateString() === ahora.toDateString()) min = ahora.getHours() * 60 + ahora.getMinutes() + cfg.antic;
    var out = [];
    for (var t = h[0]; t + durTotal() <= h[1]; t += 15) { if (t < min) continue; var p = planPara(d, t); if (p) out.push({ t: t, plan: p }); }
    return out;
  }
  function proximosDias() { var out = [], d = new Date(); d.setHours(0, 0, 0, 0); for (var i = 0; i < 21; i++) { var x = new Date(d); x.setDate(d.getDate() + i); out.push(x); } return out; }

  // ---------- Pasos
  function pasos() {
    var p = [{ k: 'serv', h: 'Elegí tus servicios', p: 'Podés sumar más de uno: se hacen uno detrás del otro.' }];
    if (cfg.elige) p.push({ k: 'prof', h: '¿Con quién?', p: 'Elegí una profesional o dejá "cualquiera disponible" para tener más horarios.' });
    p.push({ k: 'hora', h: 'Día y horario', p: 'Te mostramos solo los horarios libres para todos tus servicios.' });
    p.push({ k: 'datos', h: 'Tus datos', p: 'Te confirmamos el turno por WhatsApp a este celular.' });
    p.push({ k: 'sena', h: 'Seña para confirmar', p: 'Tu horario queda guardado mientras hacés la transferencia.' });
    p.push({ k: 'fin', h: 'Tu turno', p: '' });
    return p;
  }
  function render() {
    var especial = st.modo === 'inicio' || st.modo === 'consulta';
    document.body.classList.toggle('sin-barra', especial || (st.modo === 'reserva' && pasos()[Math.min(st.paso, pasos().length - 1)].k === 'fin'));
    $('pasos').hidden = especial; $('paso-num').hidden = especial;
    if (st.modo === 'inicio') { $('paso-h').textContent = ''; $('paso-p').hidden = true; $('paso-h').hidden = true; vInicio(); return; }
    $('paso-h').hidden = false;
    if (st.modo === 'consulta') { $('paso-h').textContent = 'Consultar mi turno'; $('paso-p').textContent = 'Ingresá el número de turno y tu celular.'; $('paso-p').hidden = false; vConsulta(); return; }
    var P = pasos(); if (st.paso >= P.length) st.paso = P.length - 1;
    var paso = P[st.paso];
    $('pasos').innerHTML = P.slice(0, -1).map(function (_, i) { return '<li class="' + (i <= st.paso ? 'hecho' : '') + '"></li>'; }).join('');
    $('paso-num').textContent = paso.k === 'fin' ? '' : 'Paso ' + (st.paso + 1) + ' de ' + (P.length - 1); $('pasos').hidden = paso.k === 'fin';
    $('paso-h').textContent = paso.h; $('paso-p').textContent = paso.p; $('paso-p').hidden = !paso.p;
    ({ serv: vServ, prof: vProf, hora: vHora, datos: vDatos, sena: vSena, fin: vFin })[paso.k]();
    barra(paso.k);
  }
  function barra(k) {
    var n = st.sel.length;
    $('resumen').innerHTML = n ? '<b>' + pesos(total()) + '</b>' + n + (n === 1 ? ' servicio' : ' servicios') + ' · ' + durTxt(durTotal()) : 'Elegí al menos un servicio';
    $('atras').hidden = k === 'fin';
    var seguir = $('seguir'); seguir.hidden = k === 'fin';
    seguir.textContent = k === 'datos' ? 'Reservar horario' : k === 'sena' ? 'Enviar comprobante' : 'Continuar';
    seguir.disabled = !puedeSeguir(k);
  }
  function puedeSeguir(k) {
    if (k === 'serv') return st.sel.length > 0;
    if (k === 'prof') return true;
    if (k === 'hora') return !!st.plan;
    if (k === 'datos') return true;
    if (k === 'sena') return !!st.archivo && st.vence > Date.now();
    return false;
  }

  function vServ() {
    $('vista').innerHTML = CATS.map(function (c) {
      return '<div class="cat"><h3>' + esc(c.nombre) + '</h3>' + c.s.map(function (x) {
        var s = SERV[x[0]], on = st.sel.indexOf(s.id) !== -1;
        return '<label class="serv' + (on ? ' sel' : '') + '"><input type="checkbox" data-s="' + s.id + '"' + (on ? ' checked' : '') + '>' +
          '<span class="check" aria-hidden="true">✓</span><span><span class="nom">' + esc(s.nombre) + '</span><br><span class="det">' + durTxt(s.dur) + (s.nota ? ' · ' + esc(s.nota) : '') + '</span></span>' +
          '<span class="precio">' + pesos(s.precio) + '</span></label>';
      }).join('') + '</div>';
    }).join('');
    $('vista').querySelectorAll('input[data-s]').forEach(function (i) {
      i.addEventListener('change', function () {
        var id = i.dataset.s, k = st.sel.indexOf(id);
        if (i.checked && k === -1) st.sel.push(id); if (!i.checked && k !== -1) st.sel.splice(k, 1);
        i.closest('.serv').classList.toggle('sel', i.checked); st.plan = null; st.hora = null; barra('serv');
      });
    });
  }
  function vProf() {
    $('vista').innerHTML = st.sel.map(function (id) {
      var actual = st.prof[id] || '';
      var ops = [['', 'Cualquiera disponible']].concat(profsDe(id).map(function (p) { return [p.id, p.nombre]; }));
      return '<div class="elige"><span class="nom">' + esc(SERV[id].nombre) + '</span><div class="opciones">' + ops.map(function (o) {
        return '<button type="button" class="op" data-s="' + id + '" data-p="' + o[0] + '" aria-pressed="' + (actual === o[0]) + '">' + esc(o[1]) + '</button>';
      }).join('') + '</div></div>';
    }).join('');
    $('vista').querySelectorAll('.op').forEach(function (b) {
      b.addEventListener('click', function () { st.prof[b.dataset.s] = b.dataset.p; st.plan = null; st.hora = null; vProf(); });
    });
  }
  function vHora() {
    var dias = proximosDias();
    if (!st.dia) { for (var i = 0; i < dias.length; i++) if (horasDe(dias[i]).length) { st.dia = dias[i]; break; } }
    var html = '<div class="dias" role="group" aria-label="Día">' + dias.map(function (d, i) {
      var cerrado = !horario(d), n = cerrado ? 0 : horasDe(d).length;
      return '<button type="button" class="dia" data-i="' + i + '" aria-pressed="' + (st.dia && d.toDateString() === st.dia.toDateString()) + '"' + (n ? '' : ' disabled') + '>' +
        '<span class="d1">' + DIAS[d.getDay()] + '</span><span class="d2">' + d.getDate() + '</span><span class="d3">' + (cerrado ? 'cerrado' : n ? MESES[d.getMonth()] : 'completo') + '</span></button>';
    }).join('') + '</div>';
    var horas = st.dia ? horasDe(st.dia) : [];
    html += '<h3 style="font-size:1.25rem">' + (st.dia ? esc(fechaLarga(st.dia)) : '') + '</h3>';
    html += horas.length ? '<div class="horas" role="group" aria-label="Horario">' + horas.map(function (h) {
      return '<button type="button" class="hora" data-t="' + h.t + '" aria-pressed="' + (st.hora === h.t) + '">' + hm(h.t) + '</button>';
    }).join('') + '</div>' : '<p class="vacio">No quedan horarios para estos servicios ese día. Probá otro día' + (cfg.elige ? ' o elegí "cualquiera disponible".' : '.') + '</p>';
    if (st.plan) html += planHtml();
    $('vista').innerHTML = html;
    $('vista').querySelectorAll('.dia').forEach(function (b) { b.addEventListener('click', function () { st.dia = dias[+b.dataset.i]; st.hora = null; st.plan = null; vHora(); barra('hora'); }); });
    $('vista').querySelectorAll('.hora').forEach(function (b) {
      b.addEventListener('click', function () { st.hora = +b.dataset.t; st.plan = planPara(st.dia, st.hora); vHora(); barra('hora'); });
    });
  }
  function planHtml() {
    return '<div class="plan">' + st.plan.map(function (x) {

  }
  function vDatos() {

      campo('email', 'Email', true, 'email', ' autocomplete="email"') + campo('nac', 'Fecha de nacimiento', true, 'date') + campo('nota', 'Algo que debamos saber', true, 'area') +
      '<div class="politica"><b>Antes de reservar</b><ul>' +
      '<li>Para confirmar se abona una seña del <b>' + cfg.sena + ' %</b>: <b>' + pesos(sena()) + '</b>. Se descuenta del total.</li>' +
      '<li>Tenés <b>' + (cfg.plazo === 60 ? '1 hora' : cfg.plazo + ' minutos') + '</b> para transferir y subir el comprobante. Si no, el horario se libera.</li>' +

    ['nombre', 'apellido', 'cel', 'email', 'nac', 'nota'].forEach(function (k) {
      $('f-' + k).addEventListener('input', function (e) { st.datos[k] = e.target.value; barra('datos'); });
      $('f-' + k).addEventListener('blur', function () { if (st.datos[k]) validarDatos(k); });
    });
    $('f-acepto').addEventListener('change', function (e) { st.acepto = e.target.checked; if (st.acepto) $('e-acepto').textContent = ''; barra('datos'); });
  }
  function celNormal(v) {
    var d = String(v).replace(/\D/g, '');
    if (d.indexOf('549') === 0) d = d.slice(3); else if (d.indexOf('54') === 0) d = d.slice(2);
    if (d.charAt(0) === '0') d = d.slice(1);
    if (d.length === 12) { [3, 2, 4].some(function (i) { if (d.substr(i, 2) === '15') { d = d.slice(0, i) + d.slice(i + 2); return true; } return false; }); }
    return d.length === 10 ? '+549' + d : '';
  }
  function validarDatos(mostrar) {
    var e = {};
    if (!st.datos.nombre.trim()) e.nombre = 'Completá tu nombre.';
    if (!st.datos.apellido.trim()) e.apellido = 'Completá tu apellido.';
    if (!celNormal(st.datos.cel)) e.cel = 'Revisá el celular: código de área + número, 10 dígitos (ej.: 387 5111111).';
    if (st.datos.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.datos.email)) e.email = 'El email no parece válido.';
    if (mostrar) ['nombre', 'apellido', 'cel', 'email'].forEach(function (k) {
      var el = $('e-' + k); if (el && (mostrar === true || mostrar === k)) el.textContent = e[k] || '';
    });
    if (mostrar === true && $('e-acepto')) $('e-acepto').textContent = st.acepto ? '' : 'Para reservar tenés que aceptar las condiciones.';
    return !Object.keys(e).length && st.acepto;
  }
  function vSena() {
    $('vista').innerHTML =
      '<div class="reloj"><p>Tu horario está guardado durante</p><span class="min" id="reloj">--:--</span><p>' + esc(fechaLarga(st.dia)) + ' · ' + hm(st.hora) + ' h</p></div>' +
      '<div class="datos-pago">' +
      '<div class="dp"><span><span class="k">Monto de la seña</span><br><span class="v">' + pesos(sena()) + '</span></span></div>' +
      '<div class="dp"><span><span class="k">Alias (ejemplo)</span><br><span class="v" id="alias">' + ALIAS + '</span></span><button type="button" class="copiar" data-c="' + ALIAS + '">Copiar</button></div>' +
      '<div class="dp"><span><span class="k">Titular</span><br><span class="v">' + TITULAR + '</span></span></div></div>' +
      '<div class="subir"><b>Subí el comprobante de la transferencia</b><span style="font-size:.85rem;color:var(--muted)">Se la mostramos a recepción para confirmar tu turno.</span>' +
      '<input type="file" id="f-comp" accept="image/*,application/pdf"><label class="elegir" for="f-comp">' + (st.archivo ? 'Cambiar archivo' : 'Elegir foto o PDF') + '</label>' + (st.archivo ? '<span class="archivo">✓ ' + esc(st.archivo) + '</span>' : '') + '</div>';
    $('f-comp').addEventListener('change', function (e) { var f = e.target.files && e.target.files[0]; st.archivo = f ? f.name : ''; vSena(); barra('sena'); });
    $('vista').querySelectorAll('.copiar').forEach(function (b) {
      b.addEventListener('click', function () {
        var txt = b.dataset.c, ok = function () { b.textContent = 'Copiado'; setTimeout(function () { b.textContent = 'Copiar'; }, 1500); };
        try { navigator.clipboard.writeText(txt).then(ok, function () { seleccionar('alias'); }); } catch (x) { seleccionar('alias'); }
      });
    });
    tic();
  }
  function seleccionar(id) { var r = document.createRange(); r.selectNodeContents($(id)); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  function tic() {
    clearInterval(timer);
    var f = function () {
      var el = $('reloj'); if (!el) { clearInterval(timer); return; }
      var r = Math.max(0, st.vence - Date.now()), m = Math.floor(r / 60000), s = Math.floor(r % 60000 / 1000);
      el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      if (r === 0) { clearInterval(timer); vencido(); }
    };
    f(); timer = setInterval(f, 1000);
  }
  function vencido() {
    $('vista').innerHTML = '<span class="estado">Venció el tiempo</span><p>No recibimos el comprobante a tiempo y el horario se liberó para otra clienta. Podés reservar de nuevo.</p>' +
      '<button type="button" class="btn" id="de-nuevo">Reservar de nuevo</button>';

  function vConsulta() {
    $('vista').innerHTML =
      '<div class="campo"><label for="c-nro">Número de turno</label><input id="c-nro" placeholder="T-0042" autocomplete="off"></div>' +

  // ---------- Constancia de turno ("Mi turno")

  function waLink(txt) { return 'https://wa.me/' + waNumero() + '?text=' + encodeURIComponent(txt); }
  function calLink() {
    var d = st.dia, f = function (m) { var x = new Date(d); x.setHours(0, m, 0, 0); return x.getFullYear() + ('0' + (x.getMonth() + 1)).slice(-2) + ('0' + x.getDate()).slice(-2) + 'T' + ('0' + x.getHours()).slice(-2) + ('0' + x.getMinutes()).slice(-2) + '00'; };

      '<table class="c-tabla"><thead><tr><th>Hora</th><th>Servicio</th><th>Importe</th></tr></thead><tbody>' +

    var b = $('demo-aprobar'); if (b) b.addEventListener('click', function () { st.estado = 'confirmado'; vFin(); scrollTo(0, 0); });
    $('demo-recordatorio').addEventListener('click', function () { $('demo-msg').innerHTML = burbuja('Recordatorio del día anterior. Recepción lo envía con un clic desde la lista "Turnos de mañana".', msgRecordatorio()); });
    $('copiar-link').addEventListener('click', function () {
      var bt = $('copiar-link'), ok = function () { bt.textContent = 'Link copiado'; setTimeout(function () { bt.textContent = 'Copiar el link de mi turno'; }, 1500); };
      try { navigator.clipboard.writeText(linkTurno()).then(ok, function () { seleccionar('link-turno'); }); } catch (x) { seleccionar('link-turno'); }
    });
    $('otro').addEventListener('click', function () { st.modo = 'inicio'; render(); scrollTo(0, 0); });
  }

  // ---------- Navegación
  $('seguir').addEventListener('click', function () {
    var k = pasos()[st.paso].k;
    if (k === 'datos') { if (!validarDatos(true)) return; st.vence = Date.now() + cfg.plazo * 60000; }
    if (!puedeSeguir(k) && k !== 'datos') return;
    if (k === 'sena') { st.estado = 'revision'; st.token = Math.random().toString(36).slice(2, 10); var a = new Date(); st.pedido = fechaCorta(a) + ' ' + ('0' + a.getHours()).slice(-2) + ':' + ('0' + a.getMinutes()).slice(-2) + ' h'; }
    st.paso++; render(); scrollTo(0, 0);
  });
  $('atras').addEventListener('click', function () { if (pasos()[st.paso].k === 'sena') clearInterval(timer); if (st.paso === 0) st.modo = 'inicio'; else st.paso--; render(); scrollTo(0, 0); });

  // ---------- Opciones a decidir
  function abrir(v) { $('hoja').hidden = !v; if (v) $('o-elige').focus(); else $('abrir-decidir').focus(); }
  $('abrir-decidir').addEventListener('click', function () { abrir(true); });
  $('cerrar-decidir').addEventListener('click', function () { abrir(false); });
  $('hoja').addEventListener('click', function (e) { if (e.target === $('hoja')) abrir(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('hoja').hidden) abrir(false); });
  function aplicar() {
    var k = pasos()[st.paso].k;
    cfg.elige = $('o-elige').value === 'si'; cfg.sena = +$('o-sena').value; cfg.plazo = +$('o-plazo').value; cfg.anula = +$('o-anula').value; cfg.antic = +$('o-antic').value;
    if (!cfg.elige) st.prof = {};
    st.plan = st.hora != null && st.dia ? planPara(st.dia, st.hora) : null; if (!st.plan) st.hora = null;
    if (k === 'sena' || k === 'fin') { st.paso = 0; }
    var i = pasos().findIndex(function (p) { return p.k === k; }); st.paso = i === -1 ? 0 : i;
    render();
  }
  ['o-elige', 'o-sena', 'o-plazo', 'o-anula', 'o-antic'].forEach(function (id) { $(id).addEventListener('change', aplicar); });

  render();
})();
