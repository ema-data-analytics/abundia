<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abundia · Pedí tu turno</title>
<meta name="description" content="Pedí tu turno en Abundia, centro de estética.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
:root {
  --marca: #072519; --marca-2: #0d3425; --oro: #a8834f; --oro-claro: #d8bf98; --oro-suave: #efe5d5;
  --bg: #f3f4ef; --surface: #ffffff; --fg: #13261c; --muted: #5f6b63; --line: #dfe2d9;
  --ok: #2f7a4f; --ok-suave: #e3f1e8; --alerta: #a0522d; --alerta-suave: #f7e8de;
  --f-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; margin: 0 }
a { color: var(--oro); font-weight: 500 }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; line-height: 1.15 }
p { margin: 0 }
button, input, textarea, select { font: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px }
.gut { padding-left: 16px; padding-right: 16px }
.col { max-width: 560px; margin: 0 auto }
.cabecera { background: var(--marca); color: var(--oro-claro); padding-block: 14px 16px; text-align: center }
.cabecera img { width: min(210px, 58vw); height: auto; display: block; margin: 0 auto;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%) }
.cabecera p { font-size: .9rem; margin-top: 4px }
.pasos { display: flex; gap: 6px; padding-block: 16px 4px; list-style: none; margin: 0 }
.pasos li { flex: 1; height: 4px; border-radius: 2px; background: var(--line) }
.pasos li.hecho { background: var(--oro) }
.titulo { padding-block: 14px 6px; display: grid; gap: 4px }
.titulo .num { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--oro); font-weight: 600 }
.titulo h2 { font-size: 1.85rem }
.titulo p { color: var(--muted); font-size: .95rem }
main { padding-bottom: 120px }
.vista { display: grid; gap: 14px; padding-block: 8px 24px }
.cat { display: grid; gap: 8px }
.cat h3 { font-size: 1.3rem; padding-top: 8px; border-top: 1px solid var(--line) }
.cat:first-child h3 { border-top: 0; padding-top: 0 }
.serv { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; color: var(--fg) }
.check { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--oro); display: grid; place-items: center; color: transparent; font-size: 14px }
.serv[aria-pressed="true"] { border-color: var(--oro) }
.serv[aria-pressed="true"] .check { background: var(--oro); color: #fff }
.serv .nom { font-weight: 500 }
.serv .det { font-size: .82rem; color: var(--muted) }
.serv .precio { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap }
.zonas { display: flex; align-items: center; gap: 10px; padding: 4px 14px 10px; font-size: .9rem }
.zonas button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--oro); background: var(--surface); color: var(--oro); font-size: 1.2rem; line-height: 1 }
.caja { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px }
.caja .nom { font-weight: 600 }
.opciones { display: flex; flex-wrap: wrap; gap: 8px }
.op { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 8px 15px; font-size: .95rem }
.op[aria-pressed="true"] { background: var(--marca); color: var(--oro-claro); border-color: var(--marca) }
.dias { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px }
.dia { flex: 0 0 64px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 8px 4px; display: grid; gap: 2px; text-align: center }
.dia .d1 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.dia .d2 { font-family: var(--f-display); font-size: 1.6rem; font-weight: 600; line-height: 1 }
.dia .d3 { font-size: .72rem; color: var(--muted) }
.dia[aria-pressed="true"] { border-color: var(--oro); box-shadow: inset 0 0 0 1px var(--oro) }
.horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px }
.hora { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px 0; font-variant-numeric: tabular-nums; font-weight: 500 }
.hora[aria-pressed="true"] { background: var(--marca); color: var(--oro-claro); border-color: var(--marca) }
.vacio { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center }
.campo { display: grid; gap: 5px }
.campo label { font-size: .9rem; font-weight: 500 }
.campo label span { color: var(--muted); font-weight: 400 }
.campo input, .campo textarea { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); width: 100% }
.politica { background: var(--oro-suave); border-radius: 12px; padding: 12px 14px; font-size: .9rem; display: grid; gap: 6px }
.politica ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px }
.acepto { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem }
.acepto input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--marca) }
.resumen { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px }
.fila { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: baseline }
.fila .t { color: var(--oro); font-weight: 600; font-variant-numeric: tabular-nums }
.fila .s { font-size: .85rem; color: var(--muted) }
.total { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; font-weight: 600 }
.reloj { background: var(--marca); color: var(--oro-claro); border-radius: 14px; padding: 16px; display: grid; gap: 4px; text-align: center }
.reloj .min { font-family: var(--f-display); font-size: 2.8rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: #fff }
.pago { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; display: grid }
.dp { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line) }
.dp:last-child { border-bottom: 0 }
.dp .k { font-size: .82rem; color: var(--muted) }
.dp .v { font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-all }
.copiar { border: 1px solid var(--oro); color: var(--oro); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: .85rem }
.estado { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: .9rem; background: var(--oro-suave); color: var(--marca) }
.estado.ok { background: var(--ok-suave); color: var(--ok) }
.estado.mal { background: var(--alerta-suave); color: var(--alerta) }
.aviso { border-radius: 12px; padding: 12px 14px; font-size: .92rem; background: var(--oro-suave) }
.aviso a { overflow-wrap: anywhere; word-break: break-all }
.aviso.error { background: var(--alerta-suave); color: var(--alerta); font-weight: 500 }
.barra { position: fixed; inset: auto 0 0; background: var(--surface); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20 }
.barra .col { display: flex; gap: 10px; align-items: center }
.barra .info { flex: 1; font-size: .88rem; color: var(--muted); min-width: 0 }
.barra .info b { color: var(--fg); font-size: 1rem }
.btn { border: 0; border-radius: 12px; padding: 13px 20px; font-weight: 600; background: var(--marca); color: var(--oro-claro); text-decoration: none; display: inline-flex; justify-content: center; align-items: center; gap: 8px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.sec { background: var(--surface); color: var(--marca); border: 1px solid var(--line) }
.btn.wa { background: #1f8f4e; color: #fff }
.btn.peligro { background: var(--alerta); color: #fff }
.btn.ancho { width: 100% }
.cargando { text-align: center; color: var(--muted); padding: 40px 0 }
.modal { position: fixed; inset: 0; background: rgba(7,37,25,.55); display: grid; place-items: center; padding: 16px; z-index: 50 }
.modal .caja { max-width: 420px; width: 100% }
.pie { text-align: center; color: var(--muted); font-size: .8rem; padding: 18px 0 30px }
</style>
</head>

<script>
const SB_URL = 'https://bxdycelatncchqicigrl.supabase.co';
const SB_KEY = 'sb_publishable_sbyO2b0alUBSBvxkd-Ur1A_XYH-Tgx_';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
const TZ = 'America/Argentina/Salta';
const $ = (s) => document.querySelector(s);
const app = $('#app');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plata = (n) => '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
const fFecha = (d, o) => new Intl.DateTimeFormat('es-AR', Object.assign({ timeZone: TZ }, o)).format(new Date(d));
const fHora = (d) => fFecha(d, { hour: '2-digit', minute: '2-digit', hour12: false });
const fDiaLargo = (d) => fFecha(d, { weekday: 'long', day: 'numeric', month: 'long' });
const hoyLocal = () => fFecha(new Date(), { year: 'numeric', month: '2-digit', day: '2-digit' }).split('/').reverse().join('-');
function sumarDias(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const isoDow = (iso) => { const d = new Date(iso + 'T12:00:00Z').getUTCDay(); return d === 0 ? 7 : d; };
const ESTADOS = { pendiente_sena: ['Esperando la seña', ''], sena_a_verificar: ['Seña en revisión', ''], confirmado: ['Confirmado', 'ok'], en_curso: ['En atención', 'ok'],

  ausente: ['Ausente', 'mal'], reprogramado: ['Reprogramado', ''] };

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw new Error(error.message || 'No se pudo completar. Probá de nuevo.');
  return data;
}

let C = null;              // catálogo
const S = { paso: 1, items: [], dia: null, slots: {}, nombre: '', celular: '', nota: '', acepto: false, enviando: false, error: '' };
const clave = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());

function servicio(id) { return C.servicios.find((s) => s.id === id); }
function finDe(it) { const s = servicio(it.servicio_id); return new Date(new Date(it.inicio).getTime() + s.duracion_min * it.cantidad * 60000); }
function totalSel() { return S.items.reduce((a, it) => a + servicio(it.servicio_id).precio * it.cantidad, 0); }
function senaSel() { return Math.round(S.items.reduce((a, it) => { const s = servicio(it.servicio_id); return a + s.precio * it.cantidad * s.sena_pct / 100; }, 0)); }

function barra(info, texto, ok, accion) {
  $('#barra').hidden = false; $('#barraInfo').innerHTML = info;
  const b = $('#barraBtn'); b.textContent = texto; b.disabled = !ok; b.onclick = accion;
}
function sinBarra() { $('#barra').hidden = true; }
function pasos(n) { return '<ol class="pasos" aria-label="Paso ' + n + ' de 4">' + [1, 2, 3, 4].map((i) => '<li class="' + (i <= n ? 'hecho' : '') + '"></li>').join('') + '</ol>'; }
function titulo(n, t, p) { return pasos(n) + '<div class="titulo"><span class="num">Paso ' + n + ' de 4</span><h2>' + t + '</h2>' + (p ? '<p>' + p + '</p>' : '') + '</div>'; }
function errorHtml() { return S.error ? '<p class="aviso error" role="alert">' + esc(S.error) + '</p>' : ''; }
function arriba() { window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' }); }

// ---------------- Paso 1: servicios
function paso1() {
  S.paso = 1;
  const cats = [];
  C.servicios.forEach((s) => { let c = cats.find((x) => x.n === s.categoria); if (!c) cats.push(c = { n: s.categoria, l: [] }); c.l.push(s); });
  app.innerHTML = titulo(1, '¿Qué te querés hacer?', 'Podés elegir más de un servicio.') + errorHtml() + '<div class="vista">' +
    (cats.length ? cats.map((c) => '<section class="cat"><h3>' + esc(c.n) + '</h3>' + c.l.map((s) => {
      const it = S.items.find((i) => i.servicio_id === s.id);
      return '<div><button type="button" class="serv" aria-pressed="' + !!it + '" data-s="' + s.id + '"><span class="check">✓</span><span><span class="nom">' + esc(s.nombre) + '</span>' +
        '<span class="det"> · ' + s.duracion_min + ' min' + (s.max_zonas > 1 ? ' por zona' : '') + '</span>' + (s.descripcion ? '<br><span class="det">' + esc(s.descripcion) + '</span>' : '') +
        '</span><span class="precio">' + plata(s.precio) + (s.max_zonas > 1 ? '<span class="det"> /zona</span>' : '') + '</span></button>' +
        (it && s.max_zonas > 1 ? '<div class="zonas"><span>Zonas:</span><button type="button" data-z="-1" data-s="' + s.id + '" aria-label="Una zona menos">−</button><b>' + it.cantidad +
          '</b><button type="button" data-z="1" data-s="' + s.id + '" aria-label="Una zona más">+</button><span class="det">máximo ' + s.max_zonas + '</span></div>' : '') + '</div>';
    }).join('') + '</section>').join('') : '<p class="vacio">Por ahora no hay servicios para reservar por la web. Escribinos por WhatsApp.</p>') + '</div>';
  app.querySelectorAll('.serv').forEach((b) => b.onclick = () => {
    const id = +b.dataset.s, i = S.items.findIndex((x) => x.servicio_id === id);
    if (i >= 0) S.items.splice(i, 1); else S.items.push({ servicio_id: id, cantidad: 1, profesional_id: null, inicio: null });
    S.error = ''; paso1();
  });
  app.querySelectorAll('[data-z]').forEach((b) => b.onclick = () => {
    const it = S.items.find((x) => x.servicio_id === +b.dataset.s), s = servicio(it.servicio_id);
    it.cantidad = Math.min(s.max_zonas, Math.max(1, it.cantidad + +b.dataset.z)); it.inicio = null; paso1();
  });
  const n = S.items.length;
  barra(n ? '<b>' + plata(totalSel()) + '</b> · ' + n + (n === 1 ? ' servicio' : ' servicios') : 'Elegí al menos un servicio', 'Seguir', n > 0, () => { S.error = ''; C.centro.permite_elegir_profesional ? paso2() : paso3(); arriba(); });
}

// ---------------- Paso 2: profesional
function paso2() {
  S.paso = 2;
  app.innerHTML = titulo(2, '¿Con quién?', 'Si te da lo mismo, elegí "Cualquiera" y te damos más horarios.') + '<div class="vista">' + S.items.map((it, k) => {
    const s = servicio(it.servicio_id);
    return '<div class="caja"><span class="nom">' + esc(s.nombre) + '</span><div class="opciones">' +
      '<button type="button" class="op" data-k="' + k + '" data-p="" aria-pressed="' + (it.profesional_id === null) + '">Cualquiera</button>' +
      s.profesionales.map((p) => '<button type="button" class="op" data-k="' + k + '" data-p="' + p.id + '" aria-pressed="' + (it.profesional_id === p.id) + '">' + esc(p.nombre) + '</button>').join('') + '</div></div>';
  }).join('') + '<button type="button" class="btn sec" id="volver">← Volver a servicios</button></div>';
  app.querySelectorAll('.op').forEach((b) => b.onclick = () => { const it = S.items[+b.dataset.k]; it.profesional_id = b.dataset.p ? +b.dataset.p : null; it.inicio = null; paso2(); });
  $('#volver').onclick = () => { paso1(); arriba(); };
  barra('<b>' + plata(totalSel()) + '</b>', 'Elegir día', true, () => { paso3(); arriba(); });
}

// ---------------- Paso 3: día y horario
function diasPosibles() {
  const abiertos = new Set(C.centro.dias.map((d) => d.dia)), out = [], hoy = hoyLocal();
  for (let i = 0; i <= Math.min(C.centro.reserva_max_dias, 30); i++) { const d = sumarDias(hoy, i); if (abiertos.has(isoDow(d))) out.push(d); }
  return out;
}
async function cargarSlots(k) {
  const it = S.items[k], prev = k > 0 ? S.items[k - 1] : null;
  const desde = prev && prev.inicio && !C.centro.permite_simultaneos ? finDe(prev).toISOString() : null;
  const clv = S.dia + '|' + k + '|' + it.servicio_id + '|' + it.profesional_id + '|' + it.cantidad + '|' + desde;
  if (S.slots[clv]) return S.slots[clv];
  const r = await rpc('turnos_disponibles', { p_servicio: it.servicio_id, p_fecha: S.dia, p_profesional: it.profesional_id, p_cantidad: it.cantidad, p_desde: desde });
  return (S.slots[clv] = r || []);
}
async function paso3() {
  S.paso = 3; sinBarra();
  const dias = diasPosibles();
  if (!S.dia || !dias.includes(S.dia)) S.dia = dias[0] || null;
  let html = titulo(3, '¿Qué día y a qué hora?', 'Te mostramos solo los horarios libres.') + errorHtml() + '<div class="vista">';
  html += dias.length ? '<div class="dias" role="group" aria-label="Día">' + dias.map((d) => '<button type="button" class="dia" data-d="' + d + '" aria-pressed="' + (d === S.dia) + '"><span class="d1">' +
    fFecha(d + 'T15:00:00Z', { weekday: 'short' }).replace('.', '') + '</span><span class="d2">' + +d.slice(8) + '</span><span class="d3">' + fFecha(d + 'T15:00:00Z', { month: 'short' }).replace('.', '') + '</span></button>').join('') + '</div>'
    : '<p class="vacio">No hay días con atención cargados.</p>';
  html += '<div id="horarios"><p class="cargando">Buscando horarios…</p></div><button type="button" class="btn sec" id="volver">← Volver</button></div>';
  app.innerHTML = html;
  app.querySelectorAll('.dia').forEach((b) => b.onclick = () => { S.dia = b.dataset.d; S.items.forEach((i) => i.inicio = null); S.error = ''; paso3(); });
  $('#volver').onclick = () => { C.centro.permite_elegir_profesional ? paso2() : paso1(); arriba(); };
  if (!S.dia) return;
  const cont = $('#horarios');
  try {
    let h = '';
    for (let k = 0; k < S.items.length; k++) {
      const it = S.items[k], s = servicio(it.servicio_id);
      if (k > 0 && !S.items[k - 1].inicio) { h += '<div class="caja"><span class="nom">' + esc(s.nombre) + '</span><p class="det">Primero elegí el horario del servicio anterior.</p></div>'; continue; }
      const slots = await cargarSlots(k);
      h += '<div class="caja"><span class="nom">' + esc(s.nombre) + (it.cantidad > 1 ? ' · ' + it.cantidad + ' zonas' : '') + '</span>' +
        (slots.length ? '<div class="horas">' + slots.map((x) => '<button type="button" class="hora" data-k="' + k + '" data-i="' + x.inicio + '" aria-pressed="' + (it.inicio && new Date(it.inicio).getTime() === new Date(x.inicio).getTime()) + '">' + x.hora + '</button>').join('') + '</div>'
          : '<p class="vacio">No quedan horarios este día' + (k > 0 ? ' después del servicio anterior' : '') + '. Probá otro día' + (it.profesional_id ? ' o con "Cualquiera"' : '') + '.</p>') + '</div>';
    }
    cont.innerHTML = h;
    cont.querySelectorAll('.hora').forEach((b) => b.onclick = () => { const k = +b.dataset.k; S.items[k].inicio = b.dataset.i; for (let j = k + 1; j < S.items.length; j++) S.items[j].inicio = null; S.error = ''; paso3(); });
  } catch (e) { cont.innerHTML = '<p class="aviso error">' + esc(e.message) + '</p>'; }
  const listo = S.items.every((i) => i.inicio);
  barra(listo ? '<b>' + fDiaLargo(S.items[0].inicio) + '</b> · ' + fHora(S.items[0].inicio) + ' h' : 'Elegí el horario', 'Seguir', listo, () => { paso4(); arriba(); });
}

// ---------------- Paso 4: datos y confirmación
function resumenHtml(items, total) {
  return '<div class="resumen">' + items.map((it) => '<div class="fila"><span class="t">' + fHora(it.inicio) + '</span><span>' + esc(it.servicio || servicio(it.servicio_id).nombre) +
    ((it.cantidad || 1) > 1 ? ' · ' + it.cantidad + ' zonas' : '') + '<br><span class="s">' + esc(it.profesional || (it.profesional_id ? servicio(it.servicio_id).profesionales.find((p) => p.id === it.profesional_id).nombre : 'Cualquier profesional')) +
    '</span></span><span>' + plata(it.importe ?? servicio(it.servicio_id).precio * it.cantidad) + '</span></div>').join('') +
    '<div class="total"><span>Total</span><span>' + plata(total) + '</span></div></div>';
}
function paso4() {
  S.paso = 4;
  const c = C.centro;
  app.innerHTML = titulo(4, 'Tus datos', fDiaLargo(S.items[0].inicio)) + errorHtml() + '<div class="vista">' + resumenHtml(S.items, totalSel()) +
    '<div class="campo"><label for="nombre">Nombre y apellido</label><input id="nombre" autocomplete="name" value="' + esc(S.nombre) + '"></div>' +
    '<div class="campo"><label for="celular">Celular <span>(con código de área)</span></label><input id="celular" type="tel" inputmode="tel" autocomplete="tel" placeholder="387 5123456" value="' + esc(S.celular) + '"></div>' +
    '<div class="campo"><label for="nota">¿Algo que debamos saber? <span>(opcional)</span></label><textarea id="nota" rows="2">' + esc(S.nota) + '</textarea></div>' +
    '<div class="politica"><b>Antes de confirmar</b><ul>' +
    (senaSel() > 0 ? '<li>Para confirmar se paga una seña del ' + c.sena_pct + '%: <b>' + plata(senaSel()) + '</b>. Tenés <b>' + c.plazo_sena_min + ' minutos</b> para transferirla y mandar el comprobante.</li>' : '') +
    '<li>Si anulás con ' + c.cancelacion_horas + ' h o más de anticipación, la seña queda a favor para tu próximo turno. Con menos, se pierde.</li>' +
    '<li>Tolerancia de llegada: ' + c.tolerancia_min + ' minutos.</li></ul></div>' +
    '<label class="acepto"><input type="checkbox" id="acepto"' + (S.acepto ? ' checked' : '') + '> Leí y acepto estas condiciones.</label>' +
    '<button type="button" class="btn sec" id="volver">← Cambiar horario</button></div>';
  const leer = () => { S.nombre = $('#nombre').value; S.celular = $('#celular').value; S.nota = $('#nota').value; S.acepto = $('#acepto').checked; actualizar(); };
  const actualizar = () => { const ok = S.nombre.trim().length >= 2 && S.celular.replace(/\D/g, '').length >= 10 && S.acepto && !S.enviando;
    barra(senaSel() > 0 ? 'Seña <b>' + plata(senaSel()) + '</b>' : '<b>' + plata(totalSel()) + '</b>', S.enviando ? 'Reservando…' : 'Reservar turno', ok, reservar); };
  ['#nombre', '#celular', '#nota'].forEach((s) => $(s).oninput = leer); $('#acepto').onchange = leer;
  $('#volver').onclick = () => { paso3(); arriba(); };
  actualizar();
}
async function reservar() {
  S.enviando = true; S.error = ''; paso4();
  try {
    const r = await rpc('turno_reservar_web', { p: { nombre: S.nombre, celular: S.celular, nota: S.nota, clave,
      items: S.items.map((i) => ({ servicio_id: i.servicio_id, profesional_id: i.profesional_id, inicio: i.inicio, cantidad: i.cantidad })) } });
    try { localStorage.setItem('abundia_turno', r.token); } catch (e) {}
    history.replaceState(null, '', location.pathname + '?t=' + r.token);
    S.enviando = false; mostrarTurno(r, true);
  } catch (e) {
    S.enviando = false; S.error = e.message; S.slots = {};
    if (/horario|ocup|libre/i.test(e.message)) { S.items.forEach((i) => i.inicio = null); paso3(); } else paso4();
    arriba();
  }
}

// ---------------- Turno (después de reservar o con el link)
let reloj = null;
function waLink(c, texto) { const n = String(c.whatsapp || '').replace(/\D/g, ''); return n ? 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto) : null; }
function mostrarTurno(t, recien) {
  sinBarra(); clearInterval(reloj);
  const c = t.centro, est = ESTADOS[t.estado] || [t.estado, ''];
  const cuando = fDiaLargo(t.inicio) + ' a las ' + fHora(t.inicio) + ' h';
  const link = location.origin + location.pathname + '?t=' + t.token;
  let h = '<div class="vista" style="padding-top:18px">';
  if (recien) h += '<h2 style="font-size:1.9rem">¡Listo, ' + esc(t.cliente.nombre.split(' ')[0]) + '!</h2>';
  h += '<p><span class="estado ' + est[1] + '">' + est[0] + '</span></p><p>Turno <b>' + esc(t.numero) + '</b> · ' + cuando + '</p>' + resumenHtml(t.items, t.total);
  if (t.estado === 'pendiente_sena') {
    const txt = 'Hola! Soy ' + t.cliente.nombre + '. Te mando el comprobante de la seña de ' + plata(t.sena_importe) + ' del turno ' + t.numero + ' (' + cuando + ').';
    const wa = waLink(c, txt);
    h += '<div class="reloj"><p>Tenés para pagar la seña</p><span class="min" id="reloj">--:--</span><p>Si no llega a tiempo, el horario se libera.</p></div>' +
      '<div class="pago"><div class="dp"><span><span class="k">Seña a transferir</span><br><span class="v">' + plata(t.sena_importe) + '</span></span></div>' +
      (c.alias ? '<div class="dp"><span><span class="k">Alias / CBU</span><br><span class="v" id="alias">' + esc(c.alias) + '</span></span><button type="button" class="copiar" id="copiar">Copiar</button></div>' : '') +
      (c.titular ? '<div class="dp"><span><span class="k">A nombre de</span><br><span class="v">' + esc(c.titular) + (c.banco ? ' · ' + esc(c.banco) : '') + '</span></span></div>' : '') + '</div>' +
      (wa ? '<a class="btn wa ancho" href="' + wa + '" target="_blank" rel="noopener">Mandar el comprobante por WhatsApp</a>' : '<p class="aviso">Mandá el comprobante al WhatsApp del centro.</p>') +
      '<p class="aviso">Cuando verifiquemos la transferencia, tu turno queda <b>confirmado</b>. Guardá este link para verlo o anularlo: <a href="' + link + '">' + esc(link) + '</a></p>';
  } else if (t.estado === 'confirmado') {
    const items = t.items.filter((i) => i.indicaciones);
    h += (items.length ? '<div class="aviso"><b>Para tener en cuenta:</b><br>' + items.map((i) => esc(i.servicio) + ': ' + esc(i.indicaciones)).join('<br>') + '</div>' : '') +
      '<p class="aviso">Te esperamos. Tolerancia de llegada: ' + c.tolerancia_min + ' minutos. Guardá este link: <a href="' + link + '">' + esc(link) + '</a></p>';
  }
  if (t.puede_anular) h += '<button type="button" class="btn sec ancho" id="anular">Anular el turno</button>';
  h += '<a class="btn sec ancho" href="' + location.pathname + '">Pedir otro turno</a></div>';
  app.innerHTML = h;
  if ($('#copiar')) $('#copiar').onclick = async () => { try { await navigator.clipboard.writeText(c.alias); $('#copiar').textContent = '¡Copiado!'; } catch (e) { $('#copiar').textContent = 'Copialo a mano'; } };
  if ($('#reloj')) {
    const fin = new Date(t.sena_vence_at).getTime();
    const tic = () => { const s = Math.max(0, Math.round((fin - Date.now()) / 1000)); $('#reloj') && ($('#reloj').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')); if (!s) clearInterval(reloj); };
    tic(); reloj = setInterval(tic, 1000);
  }
  if ($('#anular')) $('#anular').onclick = () => confirmarAnular(t);
}
function confirmarAnular(t) {
  const texto = t.estado === 'pendiente_sena' || !t.sena_pagada ? 'Se libera el horario.'
    : t.anula_a_tiempo ? 'Faltan más de ' + t.centro.cancelacion_horas + ' h: tu seña queda a favor para el próximo turno.'
    : 'Faltan menos de ' + t.centro.cancelacion_horas + ' h: <b>la seña no se devuelve</b>.';
  $('#modalCaja').innerHTML = '<h3 style="font-size:1.5rem">¿Anular el turno?</h3><p>' + texto + '</p><div class="opciones"><button type="button" class="btn peligro" id="si">Sí, anular</button><button type="button" class="btn sec" id="no">No</button></div><p id="merr"></p>';
  $('#modal').hidden = false;
  $('#no').onclick = () => $('#modal').hidden = true;
  $('#si').onclick = async () => {
    $('#si').disabled = true;
    try { const r = await rpc('turno_anular_web', { p_token: t.token }); $('#modal').hidden = true; await abrirTurno(t.token, r.mensaje); }
    catch (e) { $('#merr').innerHTML = '<span class="aviso error">' + esc(e.message) + '</span>'; $('#si').disabled = false; }
  };
}
async function abrirTurno(tok, mensaje) {
  const t = await rpc('turno_ver', { p_token: tok });
  if (!t) { app.innerHTML = '<p class="aviso error" style="margin-top:20px">No encontramos ese turno. Revisá el link.</p><p style="margin-top:14px"><a class="btn" href="' + location.pathname + '">Pedir un turno</a></p>'; return; }
  mostrarTurno(t, false);
  if (mensaje) app.insertAdjacentHTML('afterbegin', '<p class="aviso" style="margin-top:16px" role="status">' + esc(mensaje) + '</p>');
}

(async function inicio() {
  try {
    const tok = new URLSearchParams(location.search).get('t');
    if (tok) return await abrirTurno(tok);
    C = await rpc('turnos_catalogo');
    if (C.centro && C.centro.nombre) document.title = C.centro.nombre + ' · Pedí tu turno';
    paso1();
  } catch (e) { app.innerHTML = '<p class="aviso error" style="margin-top:20px">No pudimos cargar la página: ' + esc(e.message) + '. Probá de nuevo en un rato.</p>'; }
})();
</script>
